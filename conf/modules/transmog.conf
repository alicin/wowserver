[worldserver]
###################################################################################################
# mod-transmog — overrides
# Pinned: azerothcore/mod-transmog @ 0d85cbc53d63ce2df8527169ce6ae47f5f6f6ba8 (branch master)
# Upstream conf/transmog.conf.dist sets 54 keys. This file sets 2, and one of them is here purely
# because the .dist and the code disagree.
#
# NO INLINE COMMENTS.
#
# NPC entry 190010 (.npc add 190010). The most-installed AC module; the defaults are sane and
# nothing about this server argues with them, so almost nothing is overridden.
#
# CORRECTION TO A WIDELY-REPEATED CLAIM, so nobody adds two keys that do nothing: mod-transmog
# does NOT require EnablePlayerSettings = 1 or DBC.EnforceItemAttributes = 0. Neither string
# appears in its README, conf or source. Both are real worldserver.conf keys, they are just not
# this module's dependency, and conf/worldserver.conf leaves both at their defaults.
#
# You are building fresh, so the pre-b34bc28e npc_text 50000/50001 cleanup does not apply — the
# module uses 601083/601084 now, which is what TransmogNpcText and SetNpcText already say.
###################################################################################################

Transmogrification.Enable = 1

#    THE .dist SHIPS 200100, THE CODE DEFAULTS TO 2000100 — one digit apart, and the code path is
#    `if (SpellInfo const* s = sSpellMgr->GetSpellInfo(PetSpellId)) PetEntry = s->Effects[0].MiscValue;`
#    so the wrong id silently leaves PetEntry unset rather than erroring. Carried so that omitting
#    the line cannot pick the other one.
Transmogrification.PetSpellId = 200100

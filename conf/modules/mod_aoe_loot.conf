[worldserver]
###################################################################################################
# mod-aoe-loot — overrides
# Pinned: azerothcore/mod-aoe-loot @ b5c663572d936985c19dc8b499ecea60e1da570d (branch master)
# Upstream conf/mod_aoe_loot.conf.dist sets four keys, all matching their compiled defaults.
# Written out in full: the file is four lines and every one of them is a decision.
#
# NO INLINE COMMENTS.
#
# Loot every corpse in range in one action. Tier 1 here for a specific reason: AutoBalance-scaled
# trash dies in packs, and corpse-by-corpse looting with three people is the single most-felt
# papercut on this server. Nothing else in the module set overlaps it — do NOT also install
# TerraByte-tbwps/mod-aoe-loot, which is a separate from-scratch reimplementation of the same job.
###################################################################################################

AOELoot.Enable = 1

#    Chat feedback on login. Cheap and it makes "is this even installed" answerable.
AOELoot.Message = 1

#    Yards. Upstream's value; generous enough to cover a pulled pack without hoovering the room.
AOELoot.Range = 55.0

#    Respect group loot rules rather than bypassing them. Matters here because the roll is what
#    splits drops between three friends.
AOELoot.Group = 1

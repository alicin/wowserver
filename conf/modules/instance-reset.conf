[worldserver]
###################################################################################################
# mod-instance-reset — overrides
# Pinned: azerothcore/mod-instance-reset @ 1e2c20770f40f5382348b7649291371f47c86812 (branch master)
# Upstream conf/instance-reset.conf.dist sets seven keys. This file sets 4, and NormalModeOnly is
# here because omitting it would not give the .dist behaviour.
#
# NO INLINE COMMENTS.
#
# A gossip NPC (entry 300000) that lets players reset their own lockouts without a GM. The point
# for three people is grinding boss attempts: worldserver.conf already raises
# AccountInstancesPerHour to 20, and this covers the saved-instance half.
#
# You may not need it. The core has .instance listbinds and .instance unbind all as GM commands
# (cs_instance.cpp), and mod-assistant's NPC does the same job for gold. Three overlapping ways to
# clear a lockout is fine — none of them conflict — but know that you have them.
###################################################################################################

instanceReset.Enable    = true
instanceReset.Announcer = true

#    THE .dist SHIPS false, THE CODE DEFAULTS TO 1 (true). Omitting this line would restrict the
#    NPC to NORMAL-mode instances only, which excludes exactly the heroics and raids the module is
#    wanted for. Carried deliberately, and it is also the value we want.
instanceReset.NormalModeOnly = false

#    0 = free, 1 = costs a token, 2 = costs gold, 3 = both. Free: this is a convenience for three
#    friends re-pulling a boss, not a gold sink. TokenID/TokenCount/MoneyCount are only read at
#    1/2/3 and are left at their .dist values.
instanceReset.TransactionType = 0

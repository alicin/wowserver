[worldserver]
###################################################################################################
# mod-npc-enchanter — overrides
# Pinned: azerothcore/mod-npc-enchanter @ af32add66eafc0e0eb8775999e76ceed75f18b74 (branch master)
# Upstream conf/npc_enchanter.conf.dist sets nine keys. This file sets six, and four of those six
# are here because omitting them would NOT give the .dist behaviour.
#
# NO INLINE COMMENTS.
#
# An NPC that applies enchants to gear. Tier 1 because 3.3.5a has 11 primary professions and two
# per character: three people can hold six primaries at absolute best, and nobody wants to be the
# designated enchanter.
###################################################################################################

Enchanter.Enable   = 1
Enchanter.Announce = 1

#    THE .dist SHIPS 0, THE CODE DEFAULTS TO 44940. Omitting this line makes the NPC cast spell
#    44940 on itself on a timer, which upstream deliberately turned off in the shipped config.
#    Carried for that reason, not as a preference.
Enchanter.EmoteSpell = 0

###################################################################################################
# IDLE CHATTER
#
# The NPC picks a phrase with urand(1, NumPhrases) and looks up "EC.P<n>" — a CONSTRUCTED key
# name, so it never appears literally in the source and a naive grep says nothing reads it. The
# code default for that lookup is the empty string, and the "Sanitize" branch above it checks the
# wrong variable (the key name, never the message), so a missing EC.P<n> yields a silent empty
# say rather than the intended error text. That is why these three are carried verbatim from the
# .dist rather than omitted: NumPhrases = 3 means EC.P1..EC.P3 must all exist.
###################################################################################################

Enchanter.NumPhrases = 3
EC.P1 = I can infuse your weapons with magical energy.
EC.P2 = My enchantments are known across all of Azeroth!
EC.P3 = Greetings traveller. Care to see my wares?

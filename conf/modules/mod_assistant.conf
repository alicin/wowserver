[worldserver]
###################################################################################################
# mod-assistant — overrides
# Pinned: noisiver/mod-assistant @ 77505b1a3d561438a13fd3fabfe40676daa7fdfe (branch master)
# Upstream conf/mod_assistant.conf.dist sets 38 keys; every one of them matches its compiled-in
# default, so this file only carries what differs plus the three per-phase keys. This file sets 5.
#
# NO INLINE COMMENTS.
#
# One NPC (entry 9000000) that is five modules in one: heirlooms, glyphs, gems, enchants, elixirs,
# food, free bags, profession skill-ups, flight paths and instance-lockout resets. The author
# states up front that they do not accept most pull requests — treat it as frozen third-party code
# and never move the pin casually.
#
# THREE OF THIS SERVER'S TEN PER-PHASE KEYS LIVE IN THIS FILE. They are the profession and flight
# path tiers, which are the one place where "level cap only" gating is not enough: a level-60
# character cannot reach the TBC or WotLK trainers, but this NPC would hand them 375 or 450 skill
# for gold anyway, and would sell Northrend flight paths for a continent they cannot reach.
###################################################################################################


###################################################################################################
# PROFESSION SKILL TIERS — per phase
#
# Apprentice 75 / Journeyman 150 / Expert 225 / Artisan 300 / Master 375 / GrandMaster 450.
# The first four are all reachable at level 60 with vanilla trainers, so they stay on in every
# phase at their upstream defaults (Enabled = 1) and are not written here. The last two are the
# TBC and WotLK ceilings and they move.
#
# Overlap warning, from modules.md §6.1: mod-npc-free-professions is also installed and its
# NpcFreeProfessions.GivenCraftLevel = 450 does the same job by a different route. THIS FILE OWNS
# THE PER-PHASE PROFESSION GATE; see conf/modules/mod_npc_free_professions.conf for how the other
# one is kept from undoing it.
###################################################################################################

# PHASE  Assistant.Professions.Master.Enabled  p1=0  p2=1  p3=1
Assistant.Professions.Master.Enabled = 0

# PHASE  Assistant.Professions.GrandMaster.Enabled  p1=0  p2=0  p3=1
Assistant.Professions.GrandMaster.Enabled = 0


###################################################################################################
# FLIGHT PATHS — one per phase
#
# Assistant.FlightPaths.Vanilla.Enabled and .BurningCrusade.Enabled are 1 upstream and stay on.
# Their RequiredLevel keys (60 and 70) are LEVEL gates, not phase gates: they are already correct
# in all three phases and must not be touched by scripts/phase.sh. Only the WotLK toggle moves.
# WrathOfTheLichKing.RequiredLevel is 80 upstream, which is correct for phase 3 as shipped.
###################################################################################################

# PHASE  Assistant.FlightPaths.WrathOfTheLichKing.Enabled  p1=0  p2=0  p3=1
Assistant.FlightPaths.WrathOfTheLichKing.Enabled = 0


###################################################################################################
# EVERYTHING ELSE
#
# Left at upstream defaults, all of which are on and all of which are wanted:
#   Heirlooms, Glyphs, Gems, Enchants, Elixirs, Food, Containers (free bags — do this before
#   adding a bank module), Utilities and its four gold costs, Instances.Heroic, Instances.Raid.
#
# One correction for anyone reading the .dist: it also carries Assistant.Instances.Enabled, and
# NOTHING IN THE MODULE READS THAT KEY. The heroic and raid toggles are read individually. Do not
# set it expecting a master switch.
#
# The two lines below are the reason instance lockouts are not a blocker for three people grinding
# boss attempts. Written out because they overlap mod-instance-reset, which is also installed:
# this NPC charges gold per reset, mod-instance-reset's gossip NPC (entry 300000) is free by
# default. Either is fine; they do not conflict.
###################################################################################################

Assistant.Instances.Heroic.Enabled = 1
Assistant.Instances.Raid.Enabled   = 1

[worldserver]
###################################################################################################
# mod-reset-raid-cooldowns — overrides
# Pinned: sogladev/mod-reset-raid-cooldowns @ fd2391fb8755673270c982846a29bb3bf5648969 (main)
# Upstream conf/reset_raid_cooldowns.conf.dist sets seven keys, all matching their compiled
# defaults. This file sets 3.
#
# NO INLINE COMMENTS.
#
# Clears Sated/Exhaustion and resets long cooldowns after an encounter. The highest-value Tier 2
# module for this server, for a plain reason: three people wiping on a boss currently wait ten
# minutes for Bloodlust and Rebirth before they can try again, and the wipe-to-pull cycle is most
# of what a three-person raid night is.
#
# The spell list and category are left at upstream's:
#   ModResetRaidCooldowns.Spells     = 42650, 2062, 2894, 1122
#     Army of the Dead, Fire Elemental Totem, Fire Elemental Totem, Inferno.
#   ModResetRaidCooldowns.Categories = 26
#     the Bloodlust/Heroism/Time Warp category, which is where Sated/Exhaustion lives.
# Both are read as one string; do not reformat them.
###################################################################################################

ModResetRaidCooldowns.Enable = 1

#    Upstream 0. Turned on: WotLK heroics with three bodies are exactly as attempt-heavy as raids,
#    and the anti-abuse guard below applies equally there.
ModResetRaidCooldowns.EnableForHeroics = 1

#    Upstream's value. The encounter must have lasted this long before cooldowns reset, which is
#    what stops the whole thing being farmed off trash pulls. Do not lower it.
ModResetRaidCooldowns.CombatTimeRequiredInSeconds = 30

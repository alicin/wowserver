[worldserver]
###################################################################################################
# mod-toy-robot — overrides
# LOCAL module: build/modules/mod-toy-robot, not a modules.txt pin. It has no upstream and no
# SHA; it is versioned by this repo's history like the rest of build/.
# Upstream conf/mod_toy_robot.conf.dist sets three keys. All three are repeated here.
#
# NO INLINE COMMENTS.
#
# The Pocket Concierge: item 90000, handed to every character at login, which unfolds into
# BUTL-R 9000 (creature 9000200) — bank, vendor, reagents, repair, auction house, mailbox,
# barbershop, guild vault and the hunter stable. See
# docs/utility-npcs.md §7, and build/modules/mod-toy-robot/README.md for the mechanics.
#
# WHY THE KEYS ARE LISTED HERE EVEN THOUGH THEY MATCH THE .dist:
# deploy/docker-compose.yml bind-mounts this directory over /opt/ac/etc/modules, which shadows
# the image's installed .conf.dist entirely, and ConfigMgr only ever opens `<name>.conf`. A key
# omitted here does NOT fall back to the .dist — it falls back to the literal compiled into
# toy_robot.cpp. Those are identical today and listing the keys removes the question.
###################################################################################################

#    1 is the intended steady state. Setting 0 stops the login grant, makes an existing copy say
#    so and do nothing, and empties the robot's gossip menu. It deletes NOTHING — item_template
#    90000 and creature_template 9000200 are data and stay in the world DB, and copies already in
#    players' bags stay there. Applies on `.reload config` except to robots already standing in
#    the world, which run out their five minutes.
ToyRobot.Enable = 1

#    Put a Pocket Concierge in the bags of any character that does not have one, at every login.
#
#    THIS IS A RE-GRANT, NOT A ONE-TIME GIFT. The check is HasItemCount(90000, 1, true) — bank
#    included — and there is no "already given" flag anywhere. Destroy the toy and the next login
#    hands you another. That is deliberate: no character can end up permanently without it and
#    there is no extra table to keep. It also means a player who wants the bag slot back cannot
#    have it while this is 1. Set 0 to stop handing it out without disabling the toy; existing
#    copies keep working.
ToyRobot.GrantOnLogin = 1

#    Seconds a summoned robot stays before despawning.
#
#    300 is not arbitrary. The item carries stock spell 67826 (Jeeves) purely so the client has a
#    real spell to render, and that spell's own tooltip tells the player the robot lasts five
#    minutes. Change this and the item's tooltip lies. 0 is rejected at load and 3600 is the
#    ceiling; both fall back with a log line rather than producing a robot that despawns instantly.
#
#    There is no cooldown on the toy — using it again despawns your previous robot and places a
#    new one — so this is a convenience limit, not rationing.
ToyRobot.DurationSecs = 300

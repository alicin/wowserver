[worldserver]
###################################################################################################
# mod-npc-free-professions — overrides
# Pinned: azerothcore/mod-npc-free-professions @ 01d8624f9c0789550c0b04b23c54928b054619ce (master)
# Upstream conf/mod_npc_free_professions.conf.dist sets 16 keys, all matching their compiled
# defaults. This file sets 2.
#
# NO INLINE COMMENTS.
#
# Grants a profession at GivenCraftLevel with all its recipes. The 14 NpcFreeProfessions.Enable.*
# toggles (11 primaries plus Cooking, FirstAid, Fishing) are all 1 upstream and all stay on; they
# are not written here.
#
# ── THE OVERLAP THAT HAS TO BE RESOLVED SOMEWHERE, AND IS RESOLVED HERE ─────────────────────────
# mod-assistant is also installed and it gates profession skill by tier per phase
# (Artisan 300 in phase 1, Master 375 in phase 2, GrandMaster 450 in phase 3 —
# conf/modules/mod_assistant.conf). This module's GivenCraftLevel default is 450, which would hand
# a level-60 character WotLK-ceiling skill on day one and make that entire phase gate pointless.
#
# modules.md §6.1 says to resolve the overlap in config and to let ONE of them own the gate. Its
# exact words are "let mod-assistant own the per-phase Artisan/Master/GrandMaster gate and leave
# NpcFreeProfessions.GivenCraftLevel alone, or vice versa" — and READ LITERALLY, THE FIRST HALF OF
# THAT IS SELF-DEFEATING: leaving GivenCraftLevel at 450 while mod-assistant gates Master and
# GrandMaster means this NPC simply hands out 450 in phase 1 and the gate never bites. The two
# real options are "mod-assistant owns it AND this drops to 300", or "this owns it AND
# mod-assistant's two profession keys come out". The first is taken here.
#
# GivenCraftLevel is dropped to 300, the vanilla Artisan ceiling, so the NPC hands out a profession
# you can then level normally, and mod-assistant owns the tier unlocks.
#
# 300 IS NOT MARKED # PHASE, on purpose. Raising it per phase would duplicate mod-assistant's
# gate in a second file and give scripts/phase.sh two places to get it wrong. If you would rather
# this NPC track the phase, delete mod-assistant's two profession keys first — do not run both.
###################################################################################################

NpcFreeProfessions.Enable = 1

#    Was 450. See above.
NpcFreeProfessions.GivenCraftLevel = 300

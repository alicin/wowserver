[worldserver]
###################################################################################################
# mod-quest-loot-party — overrides
# Pinned: pangolp/mod-quest-loot-party @ 6f073c1bef1bba1aa73787d1e30db7429f2b1c7b (branch master)
# Upstream conf/mod-quest-loot-party.conf.dist sets two keys, both matching their compiled
# defaults. Both are written here because the file is two lines.
#
# NO INLINE COMMENTS.
#
# Everyone in the group gets the quest drop off one NPC. Removes the "we all need 12 of these, so
# kill it 36 times" tax, which is a large multiplier on a three-person server and the single
# biggest reason group questing feels slower than solo questing at Blizzlike rates.
###################################################################################################

QuestParty.Enable  = true

#    Tells people it happened, so nobody kills the extra 24.
QuestParty.Message = true

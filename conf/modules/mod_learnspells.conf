[worldserver]
###################################################################################################
# mod-learn-spells — overrides
# Pinned: azerothcore/mod-learn-spells @ 016b92d520f343d074ffd5d46016a94f4a3a6ebd (branch master)
# Upstream conf/mod_learnspells.conf.dist sets four keys, all matching their compiled defaults.
#
# NO INLINE COMMENTS.
#
# Auto-learns rank-ups on level, Cataclysm-style. Kills the every-two-levels trainer trip, which
# is pure friction for three people who want to be in a dungeon.
#
# Heads-up for anyone reading the .dist: LearnSpells.Announce is in the file and NOTHING IN THE
# MODULE READS IT. Setting it does nothing; it is not written here.
###################################################################################################

LearnSpells.Enable = 1

#    1 = a brand-new character gets its level-1 kit at first login instead of waiting for level 2.
#
#    This changes WHEN, never WHAT. OnPlayerLevelChanged passes oldLevel to LearnSpellsForNewLevel
#    (mod_learnspells.cpp:36), which loops `for (level = fromLevel; level <= upToLevel; ++level)`
#    (mod_learnspells.cpp:411) -- so the 1 -> 2 ding already re-scans level 1 and hands out the
#    identical set. Flipping this to 1 removes one level of lag and adds no spell that the module
#    would not have granted anyway. That matters here because StartPlayerLevel and
#    StartHeroicPlayerLevel are both 1 (conf/worldserver.conf:303,313): a character parked at 1
#    never dings, so with 0 it never gets the level-1 pass at all.
#
#    Verified NOT to disturb mod-dk-lowlevel. At level 1 the only SPELLFAMILY_DEATHKNIGHT spells
#    with BaseLevel 1 and a RaceMask=0 / AcquireMethod=0 SkillLineAbility row are 45470 Death
#    Strike -- which is in the module's own m_ignoreSpells (mod_learnspells.cpp:50) -- and 55610
#    Improved Icy Talons, a talent rank killed by the GetTalentSpellPos gate
#    (mod_learnspells.cpp:457-459). Net grant for a level-1 DK: zero spells. The six stock DK
#    abilities the DK feature flipped to AcquireMethod=0 all carry BaseLevel 55, so they stay
#    gated on level 55 exactly as DESIGN.md section 4 intends.
LearnSpells.OnFirstLogin = 1

#    Upstream 80. It is a hard ceiling on the module, not a phase gate: MaxPlayerLevel already
#    stops anyone reaching 61 in phase 1, and leaving this at 80 means the file needs no edit when
#    the cap moves. Deliberately NOT marked # PHASE.
LearnSpells.MaxLevel = 80

[worldserver]
###################################################################################################
# mod-individual-xp — overrides
# Pinned: azerothcore/mod-individual-xp @ 503471f766bc4f21dca0aa05e6a9d3d40718a780 (branch master)
# Upstream conf/individual_xp.conf.dist sets five keys, all matching their compiled defaults.
# All five are written here anyway, because this module is one of the four systems that can price
# XP and the whole set should be readable in one place.
#
# NO INLINE COMMENTS.
#
# Per-character XP multiplier, driven in game by:
#   .xp view      show current rate
#   .xp set #     set it, capped by MaxXPRate
#   .xp default   back to DefaultXPRate
#   .xp disable   stop gaining XP entirely
#   .xp enable    resume
#
# IT MULTIPLIES ON TOP OF Rate.XP.*, IT DOES NOT REPLACE IT. The hook is OnPlayerGiveXP, which
# fires after the core has already applied the server rate:
#     amount = static_cast<uint32>(std::round(static_cast<float>(amount) * data->XPRate));
# So on this server's 2x, `.xp set 2` is an effective 4x. Say that out loud before handing the
# command to anyone.
#
# It is per CHARACTER, not per account — stored against CharacterGUID in the `individualxp` table
# — so a latecomer has to run .xp set on each character.
#
# Installing it changes nothing on its own. At DefaultXPRate = 1 the multiplier is 1x until
# somebody runs .xp set, which is exactly why it is safe to have in the image from day one:
# it is the answer for a friend who joins two months late, and for parking an alt (.xp disable)
# to play alongside someone lower.
#
# Removing it later is NOT just deleting a line from build/modules.txt: it writes to `individualxp`
# in characters and to `command` + `acore_string` in world. Its README carries the DELETE/DROP
# statements.
###################################################################################################

IndividualXp.Enabled = true

#    Login and command feedback. On, so nobody wonders why their bar moves differently.
IndividualXp.Announce             = true
IndividualXp.AnnounceRatesOnLogin = true

#    Ceiling on what .xp set will accept. 10 here means an effective 20x against the server's 2x.
IndividualXp.MaxXPRate = 10

#    1 = "just the server rate", which is what everyone should have. This is the third of the
#    three keys that keep Rate.XP.* the sole owner of XP; the others are
#    AutoBalance.RewardScaling.XP and SoloLFG.FixedXP.
IndividualXp.DefaultXPRate = 1

# web/nginx/portal.conf -- the front proxy for the download portal.
#
# Mount this at /etc/nginx/conf.d/default.conf in an nginx container on the `wow`
# network. It exists for one reason: nginx, not Python, sends the 17 GB file.
#
#     browser  ->  nginx  ->  portal (FastAPI)      "is this person signed in?"
#                     <-      X-Accel-Redirect: /_dist/<file>
#     browser  <-  nginx      sendfile() straight off the disk
#
# The portal never opens the archive, so a download costs it one request. Range,
# resume, keep-alive, throttling and the 17 GB of I/O are all handled here, by code
# written for exactly this.
#
# NOTE ON TLS: this file serves plain HTTP on :80 because the friends connect by IP
# (167.233.128.19) and there is no name to get a certificate for. If a hostname ever
# appears, put certbot in front, add the 443 server block, and set PORTAL_TLS=1 on the
# portal service so its cookies get the Secure flag and HSTS is sent.

# The portal container, by Compose service name on the shared network.
upstream portal {
    server web:8000;
    keepalive 8;
}

# Login attempts are also limited inside the app (per IP and per username). This is the
# cheaper outer layer: it sheds a flood before it becomes a Python request at all.
#
# Keyed on the method, not just the address. An empty key disables limit_req for that
# request, so only POSTs are counted — GET /login is where every signed-out click lands
# (the app redirects there with ?next=), and counting those meant a friend browsing
# around while logged out could get a 429 on the login page itself without ever having
# typed a password. Measured: it takes about ten redirects.
map $request_method $login_attempt {
    POST    $binary_remote_addr;
    default "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The client pack is ~17 GB. Nothing here is a POST body worth more than a form.
    client_max_body_size 64k;

    # Every log line carries the real client address; without this the portal's own
    # logs and nginx's would disagree about who did what.
    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log warn;

    # Nothing on this site is worth indexing, and the IP will be scanned regardless.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /login {
        include /etc/nginx/conf.d/portal-proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/portal-proxy.inc;
    }

    # ---- the internal location the portal redirects downloads to ----
    #
    # `internal` means nginx refuses this path if it comes from a client: only an
    # X-Accel-Redirect from the upstream can reach it. So the archives are behind the
    # portal's login even though nginx is the one that sends them.
    location /_dist/ {
        internal;
        alias /srv/wow/dist/;

        # sendfile: the file goes from page cache to socket without a userspace copy.
        # tcp_nopush batches the headers with the first block. aio threads keeps a slow
        # disk read off the worker's event loop, which matters when several friends
        # pull 17 GB at once.
        sendfile on;
        tcp_nopush on;
        aio threads;
        directio 16m;
        output_buffers 4 512k;

        # nginx serves byte ranges for static files by default; this is here so that
        # turning it off is a deliberate act. Resume is the whole game on a 17 GB file.
        max_ranges 1;

        # The portal already set Content-Disposition; do not let nginx guess a type
        # that makes a browser try to render 17 GB of zip.
        types { }
        default_type application/octet-stream;
    }
}

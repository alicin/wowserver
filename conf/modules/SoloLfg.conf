[worldserver]
###################################################################################################
# mod-solo-lfg — overrides
# Pinned: azerothcore/mod-solo-lfg @ 3821fe1d108ade8d2b7ad6611e41154e05864c65 (branch master)
# Upstream conf/SoloLfg.conf.dist sets exactly four keys. All four are set here, because one of
# them is the single most damaging default in this whole config tree.
#
# NO INLINE COMMENTS.
#
# What the module does: lets RDF queue with 1-4 players instead of a full 5. It is a drop-in —
# both .patch files came out of the repo years ago (modules.md §1.3); any guide telling you to
# apply lfg-solo.patch is describing the pre-2022 version.
###################################################################################################

SoloLFG.Enable   = 1
SoloLFG.Announce = 1


###################################################################################################
# SoloLFG.FixedXP = 0 — READ THIS BEFORE CHANGING IT BACK
#
# Upstream default is 1, and at 1 this module pins EVERY instance kill to FixedXPRate = 0.2.
# Verbatim from src/Lfg_Solo.cpp:
#
#     void OnPlayerRewardKillRewarder(Player*, KillRewarder*, bool isDungeon, float& rate) override
#     {
#         if (!isDungeon || !GetOption("SoloLFG.Enable") || !GetOption("SoloLFG.FixedXP")) return;
#         // Force the rate to FixedXPRate regardless of group size, to encourage group play
#         rate = GetOption<float>("SoloLFG.FixedXPRate", 0.2);
#     }
#
# Four things make that worse than it sounds:
#
#   1. IT IGNORES WHETHER YOU QUEUED. `isDungeon` in KillRewarder.cpp is
#      `!_isPvP && sMapStore.LookupEntry(mapId)->IsDungeon()`, and IsDungeon() is
#      MAP_INSTANCE || MAP_RAID. Every kill in every instance AND every raid, RDF or not,
#      walked in or not.
#   2. IT REPLACES THE GROUP SPLIT, it does not stack with it. The `rate` it overwrites was
#      `_groupRate * playerLevel / _aliveSumLevel`, and _groupRate for a 3-player non-raid group
#      is 1.166 (Formulas.h, xp_in_group_rate). Three equal-level friends would each take
#      1.166/3 ≈ 0.389; forced to 0.2 they take about HALF that. The smaller the group, the
#      bigger the loss — the exact opposite of what a module named "solo LFG" implies.
#   3. IT STACKS UNDER Rate.XP.Kill. _RewardXP does `xp = uint32(xp * rate)` and only then calls
#      GiveXP, which applies the server rate. Net for a grouped player in any instance on this
#      server would be 2 x 0.2 = 0.4x base kill XP.
#   4. IT ONLY BITES IN A GROUP. The rate argument is consumed inside `if (_group)`, so a solo
#      player is untouched — which is why a solo test never finds it.
#
# AutoBalance.RewardScaling.XP = 0 does NOT save you from this; they are independent systems.
# Rate.XP.* in conf/worldserver.conf owns dungeon XP. This key is how that stays true.
###################################################################################################

SoloLFG.FixedXP = 0

#    Irrelevant while FixedXP = 0, and left at upstream's value on purpose. Do not "fix" it by
#    setting it to 1.0: that would be a second system asserting a dungeon XP rate, and the whole
#    point is that exactly one system does.
SoloLFG.FixedXPRate = 0.2

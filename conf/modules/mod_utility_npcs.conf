[worldserver]
###################################################################################################
# mod-utility-npcs — overrides
# LOCAL module: build/modules/mod-utility-npcs, not a modules.txt pin. It has no upstream and no
# SHA; it is versioned by this repo's history like the rest of build/.
# Upstream conf/mod_utility_npcs.conf.dist sets one key. It is repeated here.
#
# NO INLINE COMMENTS.
#
# The six utility NPCs, spawned at every inn, at every starting zone and at fourteen surprise
# locations — 734 rows in reserved creature.guid block 10000000..10099999. See
# docs/utility-npcs.md, and build/modules/mod-utility-npcs/README.md for the mechanics.
#
# WHY THE KEY IS LISTED HERE EVEN THOUGH IT MATCHES THE .dist:
# deploy/docker-compose.yml bind-mounts this directory over /opt/ac/etc/modules, which shadows
# the image's installed .conf.dist entirely, and ConfigMgr only ever opens `<name>.conf`. A key
# omitted here does NOT fall back to the .dist — it falls back to the literal compiled into
# utility_npcs.cpp. Those are identical today and listing the key removes the question.
###################################################################################################

#    1 is the intended steady state, and unlike DKLowLevel.Enable this one has no ordering gate:
#    the module is inert until its own migration has applied, and the migration is self-contained
#    (it touches nothing but `creature` and `creature_addon` inside the reserved guid block).
#
#    Setting 0 HIDES the spawns, it does not delete them — Unit::SetVisible(false), so players
#    cannot see or click them and GMs still can. It also does not take effect until each spawn's
#    grid next loads, so a `.reload config` is a partial apply and a worldserver restart is a
#    complete one. Read the .conf.dist before flipping it.
UtilityNPCs.Enable = 1

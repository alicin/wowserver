[worldserver]
###################################################################################################
# mod-multibot-bridge — overrides
# Pinned: Wishmaster117/mod-multibot-bridge @ fa7d19054e64d710c0fec4ada7bef51082f2934d (branch main)
# Upstream conf/MultiBotBridge.conf.dist has exactly one key. This is it, and it is one of the
# handful in this tree where the shipped value is NOT the compiled-in default.
#
# NO INLINE COMMENTS.
#
# Server half of the MultiBot-Chatless addon (client.md §5). Without the addon this module does
# nothing visible; without this module the addon falls back to driving bots through chat spam,
# which is the thing the addon exists to remove.
#
# VERSION LOCKSTEP IS THE REAL COST OF THIS LINE, NOT THE BUILD MINUTE. The two halves negotiate
# a protocol version at connect —
#     Addon  -> Server: MBOT HELLO~<protocolVersion>
#     Server -> Addon:  MBOT HELLO_ACK~<protocolVersion>~mod-multibot-bridge
# — with capability flags (STATE_FRAMING_V1, STRATEGY_MUTATION_V1) on top. A mismatch is a
# protocol failure at login, not graceful degradation. Bump the module pin in build/modules.txt
# and the addon revision in the client pack IN ONE COMMIT, or neither.
#
# EnableConsoleLogs: .dist ships 0, the code default is 1. Omitting this line would turn on
# per-message bridge logging for every bot command, forever. Carried deliberately.
###################################################################################################

MultiBotBridge.EnableConsoleLogs = 0

[authserver]
###################################################################################################
# wowserver — authserver.conf
#
# Overrides only. See the header of conf/worldserver.conf for the three editing rules — they apply
# here identically. In particular: NO INLINE COMMENTS. Everything after the first '=' is the value.
#
# Pinned core: mod-playerbots/azerothcore-wotlk @ 092e9ba6ff8dc6d861dddd1f31baa9d404381a85
# authserver.conf.dist at that commit sets 37 keys; this file sets 13 of them. The rest fall back
# to compiled-in defaults identical to the .dist values.
#
# authserver does almost nothing: it answers SRP6 logons against acore_auth and hands back the
# realm list. It holds no game state, so there is very little here worth changing.
###################################################################################################


###################################################################################################
# DATABASE
#
# LoginDatabaseInfo is supplied by deploy/docker-compose.yml as AC_LOGIN_DATABASE_INFO, because
# it contains ${ACORE_DB_PASSWORD} and this repo is public. The environment overrides any file
# value (Config.cpp checks env before the file map).
#
# It is a CRITICAL config option (Config.cpp, _criticalConfigOptions): absent from BOTH file and
# environment, criticalOptionSeverity = Fatal and the process ABORTs naming the key and the env
# var. That is the desired failure — loud, immediate, and self-describing — which is why no
# placeholder is committed here.
#
# LoginDatabaseInfo = "mysql;3306;acore;<ACORE_DB_PASSWORD>;acore_auth"
###################################################################################################

#    THE WORLDSERVER OWNS ALL FOUR MIGRATIONS (bring-up.md §2.4). Two processes running DBUpdater
#    against acore_auth at the same time is how you get a half-applied update table.
#    deploy/docker-compose.yml also sets AC_UPDATES_ENABLE_DATABASES=0 and makes authserver wait
#    on `worldserver: condition: service_healthy`; this line is the belt to that braces, so the
#    file is correct even if the container is started by hand.
Updates.EnableDatabases = 0

#    One synch + one worker connection. Counted into max_connections in deploy/mysql.cnf
#    (hosting.md §6.2) along with the worldserver's eight.
LoginDatabase.WorkerThreads = 1
LoginDatabase.SynchThreads  = 1


###################################################################################################
# NETWORK
###################################################################################################

RealmServerPort = 3724

#    Binds inside the container's network namespace. deploy/docker-compose.yml publishes
#    "${TAILSCALE_IP}:3724:3724", so the tailnet address is the only one on the host that reaches
#    it (hosting.md §5.1). Narrowing this to a specific IP here would break Docker's published
#    port, which DNATs to the container's bridge address, not to loopback.
BindIP = "0.0.0.0"

#    No reverse proxy in front of authserver. Stock.
EnableProxyProtocol = 0

#    Stock 30s. The client's ping interval during the logon handshake.
MaxPingTime = 30

#    Stock 0 = accept any client build, and it must stay 0. client.md §5 recommends the
#    `awesome_wotlk` client patch, which changes the binary; 1 would reject patched clients and
#    the symptom is "Unable to connect" AFTER a successful auth handshake, which reads like a
#    network fault rather than a version check. The realm's gamebuild lives in
#    acore_auth.realmlist.gamebuild = 12340 (bring-up.md §7.3), not here.
StrictVersionCheck = 0


###################################################################################################
# BRUTE-FORCE GUARD — LEFT OFF, ON PURPOSE
#
# WrongPass.MaxCount stays at its stock 0 (no lockout). Two reasons, and the second is the one
# that decided it:
#
#   1. Nothing is exposed. Ports 3724 and 8085 never appear on a public IP (hosting.md §5.1), so
#      there is no scanning surface to protect against. Three known accounts, one tailnet.
#   2. WrongPass.BanType 0 bans the CLIENT IP, and inside Docker it is not certain the client IP
#      is the client's. Depending on whether a published port is served by iptables DNAT or by
#      the userland docker-proxy, authserver may see every connection as coming from the bridge
#      gateway. An IP ban on that address locks out all three friends at once. UNVERIFIED here —
#      do not turn this on without first checking what address shows up in the Auth.log line for
#      a failed logon.
#
# The failed-logon LOG is on, though: it costs one row in acore_auth.logs and it is the only way
# to answer "did they actually type the wrong password". Worth knowing while reading those rows:
# AccountMgr upper-cases BOTH the username and the password before hashing (bring-up.md §7.1),
# so passwords are case-insensitive and "wrong case" is never the answer.
###################################################################################################

WrongPass.Logging = 1


###################################################################################################
# PATHS AND LOGGING
#
# The Appender./Logger. block is MANDATORY. Log::ReadLoggersFromConfig enumerates them with
# GetKeysByString(), which reads the parsed file map only — an AC_* environment variable cannot
# supply them. With no Logger.root the core prints "Wrong Loggers configuration." and falls back
# to a bare console logger, and Auth.log never gets written.
#
# Appender: <type>,<maxLevel>,<flags>[,<file>,<mode>]   type 1=console 2=file
# Logger:   <maxLevel>,<space-separated appender names>
# Levels:   1 fatal  2 error  3 warn  4 info  5 debug  6 trace
###################################################################################################

#    Shared wow-logs volume with the worldserver. Also set as AC_LOGS_DIR in compose.
LogsDir = "/azerothcore/logs"

Appender.Console = 1,5,0,1 9 3 6 5 8
Appender.Auth    = 2,5,0,Auth.log,w

#    Upstream's value, carried unchanged: level 4 = info. This is the logger that carries the
#    "Unknown Client Build" / rejected-build lines client.md §1 tells you to grep when a friend
#    cannot get past the realm list, and the failed-logon lines from WrongPass.Logging above.
Logger.root = 4,Console Auth

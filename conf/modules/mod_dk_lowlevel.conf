[worldserver]
###################################################################################################
# mod-dk-lowlevel — overrides
# LOCAL module: build/modules/mod-dk-lowlevel, not a modules.txt pin. It has no upstream and no
# SHA; it is versioned by this repo's history like the rest of build/.
# Upstream conf/mod_dk_lowlevel.conf.dist sets five keys. All five are repeated here.
#
# NO INLINE COMMENTS.
#
# TRUE level-1 Death Knights. The module half is three PlayerScript hooks and an idempotent
# reconcile; the feature itself is mostly data (world-DB *_dbc override rows plus a client
# patch MPQ). See .work/notes/DESIGN.md.
#
# WHY ALL FIVE KEYS ARE LISTED, INCLUDING THE ONES THAT MATCH THE .dist:
# deploy/docker-compose.yml bind-mounts this directory over /opt/ac/etc/modules, which shadows
# the image's installed .conf.dist entirely, and ConfigMgr only ever opens `<name>.conf`. A key
# omitted here does NOT fall back to the .dist — it falls back to the literal compiled into
# dk_lowlevel.cpp. Those literals are currently identical to the .dist, so omitting a key would
# be harmless today and a silent behaviour change the first time either side moves. Listing all
# five removes the question.
###################################################################################################

#    THE ORDERING GATE. Ship 0. This must not become 1 until:
#      1. the 54 player_class_stats rows for Class=6 Level=1..54 are applied AND the worldserver
#         has booted with them (without them, StartHeroicPlayerLevel=1 is exit(1) at boot —
#         ObjectMgr.cpp:4878/4885), and
#      2. the spell_dbc / skilllineability_dbc / spell_ranks / spell_bonus_data rows are applied
#         and the worldserver restarted (those tables have no hot reload — LoadDBCStores has one
#         call site, World.cpp:384).
#    At 0 the module is fully inert, including the Acherus talent fix, so it is safe to ship the
#    image and the SQL in separate steps. Flipping it is `.reload config`, no restart.
DKLowLevel.Enable = 1

#    Load-bearing safety, not a preference. Player::CalculateTalentsPoints gives a sub-56 Death
#    Knight standing on map 609 only `level - 55` points, and InitTalentForLevel then wipes the
#    tree via resetTalents(true) on every login. Death Gate is a one-cast trip to Acherus, so a
#    level-30 DK logging out at a runeforge is an ordinary evening. Leave this at 1.
DKLowLevel.FixAcherusTalents = 1

#    Both at 1 because the Acherus starter chain that used to teach them is unreachable by design
#    (the spawn moves to Northshire), and Death Gate specifically is what four core anti-stranding
#    checks look for. 0 on either key means "never grant".
DKLowLevel.DeathGateLevel = 30
DKLowLevel.RuneforgingLevel = 30

#    Apprentice Riding at 20 and Journeyman at 40, matching every other class on this realm.
#    Quest 12687 used to cover this for Death Knights; nothing else does, and a DK is the one
#    class that never gets riding from playercreateinfo_skills (skill 762 is granted at rank 0,
#    which LearnDefaultSkill skips).

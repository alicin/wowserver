[worldserver]
###################################################################################################
# wowserver — worldserver.conf
#
# THIS IS AN OVERRIDES FILE, NOT A COPY OF worldserver.conf.dist.
# It contains only the keys this server deliberately changes, plus the handful that must be
# present for the process to start at all. Every key that is absent falls back to the core's
# compiled-in default, and that default is byte-identical to what worldserver.conf.dist ships:
# verified at the pinned core by extracting all 494 SetConfigValue<> defaults from
# src/server/game/World/WorldConfig.cpp and diffing them against the 594 keys in
# worldserver.conf.dist — zero real differences (the only ten "diffs" are symbolic constants:
# SEC_CONSOLE=4, SEC_ADMINISTRATOR=3, SEC_MODERATOR=1, HOUR=3600, REALM_ZONE_DEVELOPMENT=1,
# GUILD_BANKLOG_MAX_RECORDS=25, GUILD_EVENTLOG_MAX_RECORDS=100).
#   Pinned core: mod-playerbots/azerothcore-wotlk @ 092e9ba6ff8dc6d861dddd1f31baa9d404381a85
# Consequence: omitting a key here is exactly as safe as shipping the stock line. See conf/README.md.
#
# ─── THREE RULES FOR EDITING THIS FILE ──────────────────────────────────────────────────────────
#
# 1. NEVER PUT A COMMENT ON THE SAME LINE AS A VALUE.
#    ConfigMgr::ParseFile splits on the FIRST '=', trims, strips double quotes, and stops.
#    There is no inline-comment handling anywhere in the parser. `MaxPlayerLevel = 60  # PHASE`
#    parses as the string "60  # PHASE", Acore::StringTo<uint32> rejects it (it requires the
#    whole string to be consumed), and you get an ERROR log plus the COMPILED-IN DEFAULT — 80.
#    Upstream's own AutoBalance.conf.dist has exactly this bug on one line. Comments go on their
#    own line, starting in column 1.
#
# 2. PER-PHASE KEYS ARE MARKED. The line immediately above such a key is
#        # PHASE  <Key>  p1=<v>  p2=<v>  p3=<v>
#    scripts/phase.sh rewrites by key regex (^\s*Key\s*=), never by line number, and must refuse
#    to run if a key it expects is missing. NINE keys across five files carry this marker — one in
#    this file (MaxPlayerLevel) and eight under conf/modules/. That is down from server-config.md
#    §1's thirteen, because Expansion, the two CharacterCreating.Disabled masks and
#    AiPlayerbot.DisableDeathKnightLogin no longer move. Enumerate them:
#        grep -rn --include='*.conf' -A1 '^# PHASE' conf/
#    The marker line also carries the three phase values, so a script does not need its own table.
#
# 3. A KEY THAT DOES NOT EXIST IS SILENTLY IGNORED. ConfigMgr only warns about keys the CODE
#    asks for and cannot find (missingOptionSeverity = Warn). It never warns about a key sitting
#    in this file that no code reads — AddKey's "Found incorrect option" path is gated on
#    isOptional, which is false for both app and module configs, so it can never fire. Verify a
#    new key against the pinned .conf.dist before you add it. conf/README.md has the one-liner.
#
###################################################################################################


###################################################################################################
# IDENTITY AND PATHS
###################################################################################################

#    RealmID is a CRITICAL config option (Config.cpp, _criticalConfigOptions). If it is absent
#    from both this file and the environment, criticalOptionSeverity = Fatal and the process
#    ABORTs — it does not fall back to a default. It must stay in this file: deploy/docker-compose.yml
#    does not set AC_REALM_ID. Must match acore_auth.realmlist.id and the realmID argument to
#    `.account set gmlevel` (bring-up.md §7.2).
RealmID = 1

#    Where the 3 GB of extracted client data is mounted (bring-up.md §3). The stock default is
#    "." — the process CWD — which is useless in a container and kills the boot 15-30 minutes in,
#    after the DB import. deploy/docker-compose.yml also sets AC_DATA_DIR to the same value and
#    the environment wins over this file; the line is here so the file is self-sufficient.
#    Cannot be changed by `.reload config` — the core says so and keeps the old value.
DataDir = "/azerothcore/data"

#    The wow-logs named volume. Also set as AC_LOGS_DIR in compose.
LogsDir = "/azerothcore/logs"

#    SourceDirectory is where DBUpdater looks for data/sql/** and modules/*/data/sql/**.
#    deploy/docker-compose.yml sets AC_SOURCE_DIRECTORY = "/opt/ac/src" and that is the
#    authoritative value, because the path is the image's choice (build/Dockerfile), not this
#    file's. Left commented so the two cannot drift.
# SourceDirectory = "/opt/ac/src"

#    Leave MySQLExecutable unset. DBUpdater shells out to a `mysql` binary and finds it on PATH
#    when this is empty (hosting.md §3.4 — that is why default-mysql-client is in the image).
#    It also cannot be set from the environment: the key mangles to the unusable AC_MY_SQLEXECUTABLE.


###################################################################################################
# DATABASES
#
# The connection strings are NOT in this file and must not be: this repo is public and the
# strings carry ${ACORE_DB_PASSWORD}. deploy/docker-compose.yml supplies all four as environment
# variables, which override any file value (Config.cpp, GetValueDefault checks the env first):
#
#     LoginDatabaseInfo       AC_LOGIN_DATABASE_INFO
#     WorldDatabaseInfo       AC_WORLD_DATABASE_INFO
#     CharacterDatabaseInfo   AC_CHARACTER_DATABASE_INFO
#     PlayerbotsDatabaseInfo  AC_PLAYERBOTS_DATABASE_INFO      (see conf/modules/playerbots.conf)
#
# Format is "host;port;user;password;database". The first three are CRITICAL options: absent from
# both file and environment, the process ABORTs with a message naming the key and the env var.
# That loud failure is deliberately preferred here over a committed placeholder password, which
# would fail later and quieter as "Access denied for user 'acore'".
# PlayerbotsDatabaseInfo is not on the critical list; missing, it logs
# "Database Playerbots not specified in configuration file!" and the pool fails to open.
#
# LoginDatabaseInfo     = "mysql;3306;acore;<ACORE_DB_PASSWORD>;acore_auth"
# WorldDatabaseInfo     = "mysql;3306;acore;<ACORE_DB_PASSWORD>;acore_world"
# CharacterDatabaseInfo = "mysql;3306;acore;<ACORE_DB_PASSWORD>;acore_characters"
###################################################################################################

#    worldserver owns ALL FOUR database migrations (bring-up.md §2.4); authserver runs with
#    updates disabled. 7 = LOGIN|CHARACTER|WORLD. The playerbots database has its own flag in
#    conf/modules/playerbots.conf (Playerbots.Updates.EnableDatabases), it is not a fourth bit here.
Updates.EnableDatabases = 7

#    Create and populate empty databases on first boot without asking. Combined with
#    AC_DISABLE_INTERACTIVE=1 in compose, this is what stops the first boot hanging on
#    "Do you want to create it? [yes (default)/no]" against a tty nobody is attached to.
Updates.AutoSetup = 1

#    One synch + one worker connection per database. Four databases, so eight connections plus
#    overhead — well inside the max_connections = 100 in deploy/mysql.cnf (hosting.md §6.2).
#    Do not raise these without redoing that count.
LoginDatabase.WorkerThreads     = 1
LoginDatabase.SynchThreads      = 1
WorldDatabase.WorkerThreads     = 1
WorldDatabase.SynchThreads      = 1
CharacterDatabase.WorkerThreads = 1
CharacterDatabase.SynchThreads  = 1


###################################################################################################
# NETWORK, CONSOLE AND SOAP
###################################################################################################

WorldServerPort = 8085

#    0.0.0.0 is correct and is NOT an exposure. This binds inside the container's network
#    namespace; deploy/docker-compose.yml publishes "${TAILSCALE_IP}:8085:8085", so the only
#    address on the host that reaches this port is the tailnet one (hosting.md §5.1).
BindIP = "0.0.0.0"

#    Three humans and ~30 bots. Bots do not use sockets, so one network thread is plenty.
Network.Threads = 1

#    The AC> console is worldserver's own stdin. compose sets stdin_open + tty for `docker attach`
#    (bring-up.md §6.3). Leaving this on is what makes the manual console work at all.
Console.Enable = 1

#    Remote access on port 3443. Not used; SOAP below is the scripted channel.
Ra.Enable = 0

###################################################################################################
#    SOAP — the scripted channel into a running server.
#
#    There is no worldserver-cli binary (server-config.md §1, scripts/phase.sh spec). SOAP is how
#    scripts/phase.sh announces and issues `server shutdown 300`, and how the weekly restart in
#    hosting.md §7.6 reaches the world. Default is 0, so without this line those scripts have no
#    channel at all.
#
#    SOAP.IP = 0.0.0.0 IS DELIBERATE AND IT CONTRADICTS server-config.md §1, WHICH SAYS TO LEAVE
#    IT ON LOOPBACK. Read this before "fixing" it:
#      Main.cpp passes SOAP.IP straight to soap_bind(). Bound to 127.0.0.1, the socket lives on
#      the CONTAINER's loopback. Docker's published port DNATs the host's 127.0.0.1:7878 to the
#      container's bridge address (172.x.y.z:7878), which a loopback-bound socket does not accept.
#      Result: `curl http://127.0.0.1:7878` on the VPS gets connection refused, and phase.sh's
#      shutdown step fails — silently, if it does not check.
#      Confinement is provided by the compose publish `127.0.0.1:7878:7878` (host loopback only)
#      plus the private `wow` bridge network, not by this bind address. Verify after any compose
#      change that `ss -ltn` on the VPS shows 7878 on 127.0.0.1 and nowhere else.
#    The caller needs an account at SEC_ADMINISTRATOR / gmlevel 3 (ACSoap.cpp) — bring-up.md §7.2.
###################################################################################################
SOAP.Enabled = 1
SOAP.IP      = "0.0.0.0"
SOAP.Port    = 7878


###################################################################################################
# PERFORMANCE — sized for a Hetzner CX33: 4 shared vCPU, 8 GB, NVMe (hosting.md §1.2, §1.3, §6)
###################################################################################################

#    MapUpdate.Threads parallelises ACROSS maps, never within one (hosting.md §1.3), and the
#    playerbot AI tick runs inside the map update — so this is the knob the bots actually consume.
#    2 of 4 vCPU for map updates leaves room for the main thread, the network thread, the global
#    ThreadPool and mysqld (~1 core under bot load, hosting.md §6.2). Do not set it to 4: mysqld
#    losing the race shows up as world-tick stalls, which look like a worldserver problem.
#    Measure before raising: Logger.diff below is at level 3, so tick overruns print themselves.
#    Read only at MapMgr::Initialize(), so a change needs a restart, not `.reload config`.
MapUpdate.Threads = 2

#    Stock. Signal handling, DB keep-alive ping, freeze check, world socket networking.
ThreadPool = 2

#    THE SINGLE MOST DANGEROUS KEY ON AN 8 GB BOX. 1 preloads every non-instanced map grid at
#    boot; the AzerothCore wiki's "at least 11 GB" figure is that state. Grids also never unload
#    once loaded, which is why hosting.md §7.6 makes the weekly restart a requirement rather than
#    housekeeping. Stock value, stated explicitly so nobody flips it looking for a speedup.
PreloadAllNonInstancedMapGrids = 0

#    Instance maps DO unload, unlike continents. 30 minutes is stock and is the right trade for
#    three friends who re-enter the same dungeon: shorter means paying the map load again.
Instance.UnloadDelay = 1800000

#    Warden is client-side anti-cheat: it reads the client's memory and kicks on mismatch.
#    Turned OFF for two reasons, in order of importance:
#      1. client.md §5 recommends `awesome_wotlk`, a PATCHED Wow.exe. Warden memory checks against
#         a patched binary are exactly the false positive it is built to produce. Everyone gets
#         kicked, and the log line does not say "your exe is patched".
#      2. The threat model is three people you know by name on a Tailscale-only realm
#         (hosting.md §5.1). There is nothing to cheat against and it costs CPU per client cycle.
Warden.Enabled = 0


###################################################################################################
# LOGGING
#
# THIS BLOCK IS MANDATORY IN A MINIMAL FILE. Log::ReadAppendersFromConfig / ReadLoggersFromConfig
# enumerate keys with sConfigMgr->GetKeysByString("Appender." / "Logger."), which reads the parsed
# FILE map only — environment overrides cannot supply them, because a key only enters that map
# when some code path queries it by name. With no Logger.root the core prints
# "Wrong Loggers configuration. Review your Logger config section." and falls back to a
# console-only root(Warn)+server(Info) pair: no Errors.log, no Playerbots.log, no sql.updates
# stream. So these lines are upstream's, carried deliberately.
#
# Appender format: <type>,<maxLevel>,<flags>[,<file>,<mode>]   type 1=console 2=file
# Logger   format: <maxLevel>,<space-separated appender names>
# Levels:  1 fatal  2 error  3 warn  4 info  5 debug  6 trace   (a logger emits everything <= its level)
###################################################################################################

Appender.Console=1,4,0,"1 9 3 6 5 8"
Appender.Server=2,5,0,Server.log,w
Appender.Playerbots=2,5,0,Playerbots.log,w
Appender.Errors=2,2,0,Errors.log,w

Logger.root=2,Console Server
Logger.diff=3,Console Server
Logger.mmaps=4,Server
Logger.scripts.hotswap=4,Console Server
Logger.server=4,Console Server
Logger.sql.sql=2,Console Errors
Logger.sql.updates=4,Console Server Errors
Logger.sql=4,Console Server
Logger.time.update=4,Console Server
Logger.module=4,Console Server
Logger.spells.scripts=2,Console Errors

#    Upstream ships this at 5 (debug). Lowered to 4 (info) on purpose: every line bring-up.md §8.2
#    tells you to watch on first boot is LOG_INFO — "Creating random bot accounts...",
#    "Waiting for N accounts loading into database", ">> N Characters loaded into database in
#    NNNN ms" — and the ">> N random bot accounts with N characters available" line is on
#    server.loading, so all of them survive. What is lost, and the only thing lost, is
#    RandomPlayerbotFactory's per-account progress line, which is LOG_DEBUG:
#        "Creating random bot characters for account: [3/13]"
#    That is the one nice thing to have during the long silent first boot. If you want it, set 5
#    for the first boot only and come back to 4 — at 5, ~30 bots write per-tick debug into
#    Playerbots.log continuously, on an 80 GB disk with no rotation configured.
Logger.playerbots=4,Console Playerbots

#    Uncomment BOTH while tuning AutoBalance (server-config.md §4). They are very loud; the
#    tuning loop there prefers `.ab mapstat` / `.ab creaturestat`, which need no logging at all.
# Logger.module.AutoBalance=5,Console Server
# Logger.module.AutoBalance_StatGeneration=5,Console Server


###################################################################################################
# LEVEL CAP — THE PHASE GATE
#
# Gating on this server is LEVEL CAP ONLY. Outland and Northrend stay reachable and that is the
# accepted, deliberate trade: the cap makes them pointless rather than closed. No zone blockers,
# no map blockers, no race/class masks. Everything else about a phase flip follows this one key.
#
# MaxPlayerLevel is registered ConfigValueCache::Reloadable::No in WorldConfig.cpp, so
# `.reload config` refuses it and says so. A phase flip is always a restart.
# Never set it below 55: the core crashes (server-config.md §7).
###################################################################################################

# PHASE  MaxPlayerLevel  p1=60  p2=70  p3=80
MaxPlayerLevel = 60


###################################################################################################
# EXPANSION AND CHARACTER CREATION
#
# Expansion = 2 IN ALL THREE PHASES. This is a change from server-config.md §1, which moved it
# 0 -> 1 -> 2. Every race and class — Death Knight, Blood Elf, Draenei — is available from day
# one, so the `UPDATE account SET expansion = N` that §1 calls "the step that gets missed"
# collapses into a one-time setup step: accounts are stamped with CONFIG_EXPANSION at creation
# (AccountMgr::CreateAccount), so with Expansion = 2 from the first boot every account and every
# playerbot is born at 2 and never needs raising again.
#
# Expansion is also Reloadable::No.
###################################################################################################

Expansion = 2

#    Deliberately 0, and deliberately present. server-config.md §1 sets these to 1536 (Blood Elf
#    + Draenei) and 32 (Death Knight) in phase 1; that is superseded. They are written out rather
#    than omitted so that "no race/class gating" is an auditable statement in the file rather than
#    an absence, and so a phase script that greps for them finds them at 0 instead of failing.
#    They are NOT marked # PHASE — they never move.
CharacterCreating.Disabled.RaceMask  = 0
CharacterCreating.Disabled.ClassMask = 0

StartPlayerLevel = 1

#    Death Knights are on from phase 1. Against a level-60 cap a DK starts at 55, i.e. five levels
#    of content and a free geared character — server-config.md §2 and §7 say explicitly not to do
#    this. Overridden on purpose; noted here so the tradeoff is visible where the numbers are.
#    The two keys below are the natural friction that remains, both at Blizzlike defaults:
#      MinLevelForHeroicCharacter = 55 requires ANOTHER level-55+ character on the same account,
#      so on a fresh realm nobody can roll a DK until somebody has levelled one to 55. Set 0 to
#      remove the prerequisite; it is ignored for GMs either way.
#      HeroicCharactersPerRealm = 1 is how many DKs one account may hold.
StartHeroicPlayerLevel                       = 55
CharacterCreating.MinLevelForHeroicCharacter = 55
HeroicCharactersPerRealm                     = 1

#    WotLK feature live from phase 1, consistent with "all WotLK classes/abilities/talent trees
#    stay available throughout". Checked against level only — there is no expansion condition in
#    the path (PlayerGossip.cpp).
MinDualSpecLevel = 40


###################################################################################################
# RATES — EXPERIENCE (2x)
#
# Rate.XP.* IS THE ONLY SYSTEM ALLOWED TO PRICE XP. Three other installed systems default to ON
# and each of them quietly re-prices dungeon XP; all three are neutralised in their own conf and
# each carries a back-reference to here:
#     conf/modules/AutoBalance.conf   RewardScaling.XP    = 0   (was ~0.68x at 3-of-5)
#     conf/modules/SoloLfg.conf       SoloLFG.FixedXP     = 0   (pinned EVERY instance kill to 0.2x)
#     conf/modules/individual_xp.conf DefaultXPRate       = 1   (multiplies on top, per character)
# The normal Blizzlike group split (~0.389 each for three equal-level friends) is NOT removed —
# it is what the 2x is compensating for. server-config.md §3, "Who owns dungeon XP".
#
# 2x supersedes the 1.5x written throughout server-config.md.
###################################################################################################

Rate.XP.Kill     = 2
Rate.XP.Quest    = 2
Rate.XP.Quest.DF = 2
Rate.XP.Explore  = 2
Rate.XP.Pet      = 2

#    Stock, and it must stay stock. The name misleads in the opposite direction to the effect:
#    this multiplies the XP a pet REQUIRES per level, so 0.05 already means pets level ~20x faster
#    than the raw curve and RAISING it would slow them down. Rate.XP.Pet above is the granting side.
Rate.Pet.LevelXP = 0.05

#    Battleground XP left at stock. Nobody is running BGs here and the bots' BG participation is
#    switched off in conf/modules/playerbots.conf, so raising these would be dead config:
#    Rate.XP.BattlegroundKill{AV,WSG,AB,EOTS,SOTA,IC} and Rate.XP.BattlegroundBonus.


###################################################################################################
# RATES — REPUTATION (10x)
#
# Rate.Reputation.Gain is applied in ReputationMgr::SetOneFactionReputation, on every incremental
# gain. The LowLevel pair is applied EARLIER, in Player::CalculateReputationGain, and it
# multiplies the percentage that Gain then scales — so the two compound. Setting all three to 10
# would be 100x, which is the trap this comment exists to prevent.
#
# Precise scope of the LowLevel keys, from Player.cpp:
#     if (rate != 1.0f && creatureOrQuestLevel <= Acore::XP::GetGrayLevel(GetLevel()))
#         percent *= rate;
# so they only bite on sources at or below your gray level — grinding old content. Left at 1.
###################################################################################################

Rate.Reputation.Gain            = 10
Rate.Reputation.LowLevel.Kill   = 1
Rate.Reputation.LowLevel.Quest  = 1

#    Battleground reputation left stock for the same reason as battleground XP:
#    Rate.Reputation.Gain.{WSG,AB,AV}.


###################################################################################################
# RATES — LOOT (3x), AND AN HONEST ACCOUNT OF WHAT IT DOES NOT DO
#
# Verified in src/server/game/Loot/LootMgr.cpp at the pinned core. The quality multipliers are
# applied in exactly one place, LootStoreItem::Roll:
#
#     if (_chance >= 100.0f)                 return true;            // <- multiplier never reached
#     if (reference)                         return roll_chance_f(_chance * RATE_DROP_ITEM_REFERENCED);
#     if (pProto->Quality < HEIRLOOM && rate) qualityModifier = getRate(qualityToRate[Quality]);
#     return roll_chance_f(_chance * qualityModifier);
#
# THREE THINGS THIS 3x THEREFORE DOES NOT TOUCH:
#
#   1. Anything already at 100% chance. The early return fires before any multiplier. Guaranteed
#      quest drops, guaranteed boss items: unchanged.
#   2. GROUPED entries. LootTemplate::LootGroup::Roll picks one winner from the group using
#      item->chance raw — the quality rates are not consulted anywhere in that function. Most
#      real boss loot is grouped, so most boss loot is unchanged.
#   3. REFERENCED loot. reference_loot_template is declared with ratesAllowed = false
#      (LootMgr.cpp:53), and the reference entry itself is priced by Rate.Drop.Item.Referenced,
#      not by quality.
#
# What is left is ungrouped, sub-100%, non-reference entries in rates-allowed stores: trash
# drops, world drops, skinning, herbalism/mining, fishing, pickpocketing, disenchant/milling/
# prospecting. That is a real and noticeable change, and it is the whole of it. If "3x loot" ever
# needs to mean "3x boss loot", the levers are the three keys below, NOT these eight — and they
# behave differently enough to be a separate decision.
###################################################################################################

Rate.Drop.Item.Poor      = 3
Rate.Drop.Item.Normal    = 3
Rate.Drop.Item.Uncommon  = 3
Rate.Drop.Item.Rare      = 3
Rate.Drop.Item.Epic      = 3
Rate.Drop.Item.Legendary = 3
Rate.Drop.Item.Artifact  = 3
Rate.Drop.Money          = 3

#    THE THREE KEYS THAT WOULD ACTUALLY MULTIPLY BOSS LOOT. Left at 1 on purpose — the decision
#    was "3x on the quality tiers and money", and these are a different, much blunter mechanism.
#    Written out so the choice is visible rather than accidental.
#      Referenced        multiplies the CHANCE a reference entry fires.
#      ReferencedAmount  multiplies the reference loop count: uint32(maxcount * rate) — integer
#                        truncation, so 1.5 is 1 and only whole numbers do anything.
#      GroupAmount       is read as `uint32 groupAmount = sWorld->getRate(...)` — also truncated —
#                        and becomes the number of times EACH top-level loot group is rolled.
#                        3 here means every boss group yields up to three items. This is the one
#                        that would visibly triple raid loot, and it is a large economy change.
Rate.Drop.Item.Referenced       = 1
Rate.Drop.Item.ReferencedAmount = 1
Rate.Drop.Item.GroupAmount      = 1


###################################################################################################
# RATES — TALENTS (+20 at the level-60 cap)
#
# Player::CalculateTalentsPoints, verified at the pinned core:
#     uint32 base_talent = GetLevel() < 10 ? 0 : GetLevel() - 9;
#     ...
#     return uint32(talentPointsForLevel * sWorld->getRate(RATE_TALENT));
#
# The cast is a C-style float -> uint32, which TRUNCATES toward zero; there is no rounding and no
# floor() call. 1.4f is stored as 1.39999997615814208984375, and the products land just ABOVE
# x.4 rather than below, so no level loses a point to representation error. Checked for every
# level 10-80; the real counts at the three caps are:
#
#     level 60:  base 51  ->  51 * 1.4f = 71.4000015  ->  71   (+20)
#     level 70:  base 61  ->  61 * 1.4f = 85.4000015  ->  85   (+24)
#     level 80:  base 71  ->  71 * 1.4f = 99.4000015  ->  99   (+28)
#
# So "+20" is exact at the phase-1 cap and grows to +24 and +28 as the cap moves — a rate is a
# multiplier, not an addend. If a flat +20 at every cap is wanted later, this key cannot express
# it. Validator is `>= 0` (WorldConfig.cpp), so 1.4 is accepted.
# m_extraBonusTalentCount is inside the multiplication too, if anything ever grants bonus points.
###################################################################################################

Rate.Talent = 1.4

#    Hunter/warlock pet talent points. Left stock; the decision was about player talents.
Rate.Talent.Pet = 1


###################################################################################################
# THREE-PLAYER QUALITY OF LIFE
###################################################################################################

#    Stock is 5. Three friends learning a boss burn five entries in twenty minutes and then get
#    "you have entered too many instances recently" for the rest of the hour, which is the exact
#    failure modules.md §2 flags. 20 is generous without being unlimited.
AccountInstancesPerHour = 20

#    Stock is 9 signatures to charter a guild. There are three humans, and the bots cannot help:
#    AiPlayerbot.AllowGuildBots is 0 in conf/modules/playerbots.conf. 0 lets the charter be
#    completed alone. A guild is load-bearing here — AiPlayerbot.BotActiveAloneForceWhenInGuild
#    is 1, so guilded bots stay simulated near you.
MinPetitionSigns = 0

#    Stock 4am daily instance reset. Left alone.
Instance.ResetTimeHour = 4

#    Stock 0. Set to 1 to let a party walk into 10/25-man content without converting to a raid
#    group. Left at 0 because two players CAN convert to a raid in 3.3.5, so this is a
#    convenience rather than a blocker. Listed so the option is discoverable.
Instance.IgnoreRaid = 0

#    Stock 0 (factions cannot chat/group/trade). Left alone — Blizzlike, and none of the pinned
#    modules depend on it. If the three of you split factions, the keys to look at are exactly
#    these eight, and no others exist:
#      AllowTwoSide.Accounts
#      AllowTwoSide.Interaction.{Chat,Channel,Group,Guild,Auction,Calendar,Arena}
#    That is a gameplay decision nobody has made yet.

[worldserver]
###################################################################################################
# mod-player-bot-level-brackets — overrides
# Pinned: DustinHendrickson/mod-player-bot-level-brackets @ a1780785f386732527de7455aac960f630d29b5d (main)
# Upstream conf/mod_player_bot_level_brackets.conf.dist sets 69 keys. This file sets 5.
#
# NO INLINE COMMENTS.
#
# Keeps the random-bot population spread across level brackets instead of clumping, moving bots
# between brackets over time. On a 30-bot roster this is the difference between "there are bots
# somewhere" and "there are bots I can group with".
#
# ── WHY THERE IS NO # PHASE KEY IN THIS FILE ────────────────────────────────────────────────────
# The 54 bracket-definition keys (Alliance/Horde Range1-9 Lower/Upper/Pct) are NOT written here,
# and this file needs no per-phase edit, because the module clamps itself to the playerbots level
# cap. From ClampAndBalanceBrackets() at the pin:
#
#     if (range[i].upper > g_RandomBotMaxLevel) range[i].upper = g_RandomBotMaxLevel;
#     if (range[i].lower > range[i].upper)      range[i].desiredPercent = 0;
#     ... then any shortfall from 100 is redistributed round-robin over the surviving brackets
#
# with g_RandomBotMaxLevel read from AiPlayerbot.RandomBotMaxLevel. So in phase 1 (cap 60) the
# 60-69 bracket collapses to exactly 60, and the 70-79 and 80 brackets zero out and give their
# share back to the rest. Moving AiPlayerbot.RandomBotMaxLevel in conf/modules/playerbots.conf
# moves this module too, with no second edit. ClampAndBalanceBrackets() is called again after
# every dynamic recalculation, so the clamp holds at runtime and not only at load.
#
# Omitting the 54 keys is safe for the same reason it is safe everywhere else in this tree: the
# compiled defaults are Lower = (i == 0 ? 1 : i*10), Upper = (i < NumRanges-1 ? i*10+9 :
# RandomBotMaxLevel), Pct = 11 — identical to the .dist except that Range1.Pct is 12 there rather
# than 11, and the sum-to-100 auto-adjust erases that difference on the next line of code.
###################################################################################################

BotLevelBrackets.Enabled = 1

###################################################################################################
# DYNAMIC DISTRIBUTION — the reason this module is worth having with only three humans
#
# With static brackets and 30 bots you get ~3 bots per bracket, which cannot fill a dungeon at any
# level. Dynamic distribution reweights the brackets toward the ones real players are actually in:
#
#     bracket_weight = 1.0 + (RealPlayerWeight * (1 / TotalRealPlayers) * log(1 + RealPlayersInBracket))
#
# normalised to 100%. It overrides the static Pct values, which is exactly why not writing them
# out costs nothing.
#
# RealPlayerWeight = 10 is upstream's own recommendation for this case; its conf says verbatim
# "If you want a large congestion of bots in your level bracket for solo play I recommend 10-15".
# The effect is gentle even at that value — at 5.0 a bracket holding every real player gets ~21.6%
# against ~9.8% for the empty ones — so do not expect it to herd the whole roster.
#
# This also makes AiPlayerbot.RandomBotMaxLevelChance = 0.4 in playerbots.conf a starting bias
# rather than a steady state: that key decides what level a bot rolls at randomize time, but THIS
# module actively moves bots afterwards on a 300s timer, so it wins in the long run. If you want
# more bots parked at the cap specifically, raise RealPlayerWeight and stand at the cap.
###################################################################################################

BotLevelBrackets.Dynamic.UseDynamicDistribution = 1
BotLevelBrackets.Dynamic.RealPlayerWeight       = 10

#    LEAVE AT 0. At 1 the module requires Alliance and Horde bracket definitions to match exactly
#    and THE SERVER FAILS TO START if they do not. Since this file deliberately omits all 54
#    bracket lines and relies on compiled defaults, there is nothing to keep in sync and nothing
#    to gain — only a boot failure to risk if someone later writes out one faction's brackets.
BotLevelBrackets.Dynamic.SyncFactions = 0

#    Seconds between distribution checks. Upstream's value. Each check walks the bot list, so this
#    is a background CPU cost on a 4-vCPU box; do not lower it looking for faster convergence.
BotLevelBrackets.CheckFrequency = 300

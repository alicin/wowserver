[worldserver]
###################################################################################################
# mod-demon-hunter — overrides
# LOCAL module: build/modules/mod-demon-hunter, not a modules.txt pin. It has no upstream and no
# SHA; it is versioned by this repo's history like the rest of build/.
# Upstream conf/mod_demon_hunter.conf.dist sets four keys. All four are repeated here.
#
# NO INLINE COMMENTS.
#
# The Demon Hunter as a real player class, class id 10 — the vacant //CLASS_UNK slot. The module
# half is three PlayerScript hooks, one AllSpellScript hook and an idempotent reconcile; the class
# itself is data (world-DB *_dbc override rows, playercreateinfo* rows and a client patch MPQ)
# plus an eight-line core patch. See build/modules/mod-demon-hunter/README.md and
# build/modules/mod-demon-hunter/tools/dh_spec.py.
#
# WHY ALL FOUR KEYS ARE LISTED, INCLUDING THE ONES THAT MATCH THE .dist:
# deploy/docker-compose.yml bind-mounts this directory over /opt/ac/etc/modules, which shadows
# the image's installed .conf.dist entirely, and ConfigMgr only ever opens `<name>.conf`. A key
# omitted here does NOT fall back to the .dist — it falls back to the literal compiled into
# demon_hunter.cpp. Those literals are currently identical to the .dist, so omitting a key would
# be harmless today and a silent behaviour change the first time either side moves. Listing all
# four removes the question.
###################################################################################################

#    THE ORDERING GATE. Ship 0, and it is still 0. This must not become 1 until:
#      1. tools/dhspells.py has been run at least once — the module does not compile without the
#         src/dh_progression.h it emits, and today data/sql/db-world/base/ contains only the class
#         and createinfo files, not the spells or talents ones, and
#      2. the player_class_stats rows for Class=10 Levels 1..80 are applied AND the worldserver
#         has booted with them. This is the gate that matters most and it is NOT the same one the
#         Death Knight had: at Enable=1 the OnPlayerIsClass hook starts answering CLASS_ROGUE for
#         CLASS_CONTEXT_STATS, so the class's attack power, armour-class rolls and weapon-swap
#         lockout all switch over in one step. With no class-10 stat rows behind that, a Demon
#         Hunter is a Rogue-shaped hole, and
#      3. the spell_dbc / skilllineability_dbc / skillline_dbc / chrclasses_dbc / talent* rows are
#         applied and the worldserver RESTARTED — those tables have no hot reload, LoadDBCStores
#         has one call site (World.cpp:384), and
#      4. the client half is shipped: patch-Z.MPQ with the class-10 DBC records, the patched
#         Wow.exe, and the DemonHunter addon with real spell ids in Movement.lua (docs/client.md).
#    At 0 the module is fully inert — no grants, no IsClass opinions, no falling gate — so it is
#    safe to ship the image well ahead of any of the above. Flipping it is `.reload config` for
#    everything except the DBC tables, which need the restart in step 3 regardless.
DemonHunter.Enable = 1

#    Load-bearing identity, not a preference. Spell 674's stock SkillLineAbility row carries
#    ClassMask 109, which does not include class 10, so learnSkillRewardedSpells skips it and the
#    class gets the Dual Wield SKILL from playercreateinfo_skills without the SPELL that sets
#    CanDualWield. Player::FindEquipSlot then never offers the off-hand slot. 0 here means a
#    dual-wield class that cannot hold two weapons. Leave it at 1.
DemonHunter.DualWieldLevel = 1

#    Same shape. Parry (3127) is trainer-taught for ClassMask 15 and automatic for Death Knights
#    only; a Demon Hunter is in neither mask and has no class trainer. Without it
#    Player::SetCanParry is never called and the parry_cap value that build/patches/0001 adds for
#    class 10 is dead. 1 rather than the stock trainer's level 6, because those six levels are a
#    trainer visit this class cannot make.
DemonHunter.ParryLevel = 1

#    Elusiveness for Night Elves, the energy Arcane Torrent for Blood Elves. Both are racials whose
#    stock ClassMask lists melee classes and was written before class 10 existed; every other elf
#    racial has ClassMask 0 and arrives on its own. Arcane Torrent is also on button 2 of a Blood
#    Elf's generated starting action bar, so 0 here leaves a new character staring at an empty
#    button.
DemonHunter.GrantRacials = 1

#    The Felfury pool's untalented cap. Clamped by the module to the felfury record's own
#    CumulativeAura cell (generated as FELFURY_STACK_CEILING in src/dh_progression.h): the pure-data
#    +1 generation path goes through Aura::ModStackAmount, which caps against that cell, so a larger
#    number here would leave the pool one short of this value forever. 0 is not an off position and
#    is not honoured — it would ship a visible aura holding nothing.
Felsworn.Felfury.MaxStacks = 5

#    Milliseconds of Inner Demon bought by one Felfury; the form's duration is the whole pool times
#    this. Script and not a cell because Player::ApplySpellMod applies a flat SPELLMOD_DURATION
#    exactly once and never multiplies it by a stack count, so Ascension's +5000 ms modifier would
#    give one Felfury and five Felfury the same five seconds. 0 is not honoured.
Felsworn.InnerDemon.MsPerFelfury = 5000

[worldserver]
###################################################################################################
# mod-rdf-expansion — overrides
# Pinned: azerothcore/mod-rdf-expansion @ c7a91c5973cda4529495b52b89375913f98726d6 (branch master)
# Upstream conf/mod-rdf-expansion.conf.dist has exactly one key. This is it.
#
# NO INLINE COMMENTS.
#
# WHY THIS MODULE IS REQUIRED, NOT OPTIONAL, IN PHASES 1 AND 2 — and it is a CLIENT limitation,
# not a server bug. The 3.3.5a Dungeon Finder decides which "Random Dungeon" entry to offer from
# your level alone: up to 58 you get "Random Classic Dungeon", and at 59 that entry DISAPPEARS and
# the client will only offer "Random Burning Crusade Dungeon". Meanwhile LFGMgr filters the list
# by the session's expansion. Put those together on a level-60 server and RDF is dead from 59
# onward — the last two levels, which is exactly where three people most want a queue that fills
# itself. Same shape at 69 in phase 2.
#
# The module rewrites the queue's dungeon ID (LFGDungeons.dbc 258-262) in one hook,
# OnPlayerQueueRandomDungeon. It does not gate content and it cannot open content: gating here is
# the level cap, and this only stops the Dungeon Finder from disagreeing with it.
#
# NOTE THE INTERACTION WITH THIS SERVER'S GATING MODEL. Expansion is 2 in every phase, so the
# server would happily hand a level-60 character a TBC random dungeon full of level 68 mobs. This
# key is what keeps the queue inside the phase, and it is now the ONLY thing that does. It matters
# MORE here than it did under server-config.md's expansion-stepping model, not less.
#
#   0 - Classic   a WotLK or TBC RDF queue joins as Classic RDF
#   1 - TBC       a WotLK RDF queue joins as TBC RDF
#   2 - WOTLK     default client behaviour
#
# At 0 every random queue resolves to Classic, which has no heroic tier — a non-issue at cap 60.
# At 1 a WotLK heroic queue is rewritten to the TBC heroic list.
#
# No overlap with mod-solo-lfg: that one changes WHO MAY QUEUE (OnPlayerLogin,
# OnPlayerRewardKillRewarder, ToggleTesting), this one changes WHAT THEY QUEUE INTO. Run both.
###################################################################################################

# PHASE  RDF.Expansion  p1=0  p2=1  p3=2
RDF.Expansion = 0

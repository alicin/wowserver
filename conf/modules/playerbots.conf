[worldserver]
###################################################################################################
# mod-playerbots — overrides
# Pinned: mod-playerbots/mod-playerbots @ a7b885d27134466dbc1c91d39b8241ea725a1bbb (branch master)
# Upstream conf/playerbots.conf.dist at that SHA sets 807 keys. This file sets 48 of them.
#
# NO INLINE COMMENTS — see conf/worldserver.conf's header. Every value here was checked to exist
# in the pinned .conf.dist; a key that does not exist is ignored in silence.
#
# Values are server-config.md §5's, unchanged, except where the level-cap-only gating decision
# or the "all races and classes from phase 1" decision forced a change. Those are called out.
###################################################################################################


###################################################################################################
# DATABASE
#
# PlayerbotsDatabaseInfo lives in this file upstream, not in worldserver.conf.dist. It carries
# ${ACORE_DB_PASSWORD}, so like the other three it is supplied by deploy/docker-compose.yml as
# AC_PLAYERBOTS_DATABASE_INFO and the environment wins.
#
# It is NOT one of Config.cpp's four critical options, so a missing value does not abort — it
# logs "Database Playerbots not specified in configuration file!" from DatabaseLoader and the
# pool fails to open. Quieter than the other three; know what it looks like.
#
# PlayerbotsDatabaseInfo = "mysql;3306;acore;<ACORE_DB_PASSWORD>;acore_playerbots"
###################################################################################################

#    The worldserver owns migrations for all four databases including this one (bring-up.md §2.4).
#    This is the playerbots database's own flag; it is NOT a fourth bit in
#    worldserver.conf's Updates.EnableDatabases = 7.
Playerbots.Updates.EnableDatabases = 1

#    Counted into max_connections in deploy/mysql.cnf (hosting.md §6.2). Playerbots is the fourth
#    connection pool and the one people forget when adding that up.
PlayerbotsDatabase.WorkerThreads = 1
PlayerbotsDatabase.SynchThreads  = 1


###################################################################################################
# POPULATION
#
# Upstream ships MinRandomBots = MaxRandomBots = 500. That is ~25x what this box can hold, and it
# is the number the wiki's "16 GB minimum" is sized for — hundreds of bots roaming the whole
# world, dragging every map grid into RAM, where they stay until restart. 30 bots parked near a
# three-person party is a different machine (hosting.md §1.2).
###################################################################################################

AiPlayerbot.Enabled            = 1
AiPlayerbot.RandomBotAutologin = 1
AiPlayerbot.MinRandomBots      = 30
AiPlayerbot.MaxRandomBots      = 30

#    0 means "work it out from MaxRandomBots", which is what you want. This is the count of
#    ACCOUNTS, not bots, and it is not the on/off switch for anything.
AiPlayerbot.RandomBotAccountCount = 0

#    Upstream 50. This pool, not MaxRandomBots, is what dominates first-boot cost — see the
#    arithmetic below. 10 accounts is still 100 characters to pull a tank or healer from with
#    `.playerbots bot addclass`.
AiPlayerbot.AddClassAccountPoolSize = 10

###################################################################################################
#    FIRST BOOT: HOW MUCH GETS BUILT, AND WHY IT IS NOT 30.
#
#    Before worldserver accepts a single login, RandomPlayerbotFactory::CreateRandomBots() creates
#    the bot accounts and a full class roster on each. Verified at the pinned SHA:
#
#      CalculateAvailableCharsPerAccount():
#          bool noDK = disableDeathKnightLogin || CONFIG_EXPANSION != EXPANSION_WRATH_OF_THE_LICH_KING;
#          uint32 availableChars = noDK ? 9 : 10;
#      CalculateTotalAccountCount():
#          neededRndBotAccounts   = ceil(MaxRandomBots / availableChars)
#          neededAddClassAccounts = AddClassAccountPoolSize
#
#    THIS SERVER RUNS Expansion = 2 AND DisableDeathKnightLogin = 0 IN EVERY PHASE, so
#    availableChars is 10, not 9:
#
#          accounts   = ceil(30 / 10) + 10  =  3 + 10  =  13
#          characters = 13 * 10             =  130
#
#    server-config.md §5 and bring-up.md §8.1 say 14 accounts / 126 characters. Those numbers
#    assumed phase 1 had Expansion = 0 and DKs off; they are superseded. Expect 13 and 130 in the
#    "Waiting for N accounts…" / "Waiting for N characters…" lines. Both loops poll the async DB
#    write queue once a second and print nothing in between, so a long silent gap is normal.
#    Reboots are nearly free: both loops skip accounts that already exist and accounts that
#    already hold a full roster, so neither line appears again.
###################################################################################################


###################################################################################################
# ACTIVITY — the single biggest CPU lever on a 4-vCPU box
#
# Rough % of bots simulated when no real player is near. Bots in combat, in an instance, in a
# BG/LFG queue, or grouped with a real player are ALWAYS active on top of this, so a low number
# costs nothing you can see. If the box struggles, halve BotActiveAlone before touching anything
# else — 10 -> 5 halves background simulation and you will not notice.
###################################################################################################

AiPlayerbot.BotActiveAlone                = 10
AiPlayerbot.BotActiveAloneDurationSeconds = 30

AiPlayerbot.BotActiveAloneForceWhenInRadius = 150
AiPlayerbot.BotActiveAloneForceWhenInZone   = 1

#    Keep 0. 1 wakes an entire continent's worth of bots whenever anyone is on that map.
AiPlayerbot.BotActiveAloneForceWhenInMap = 0

AiPlayerbot.BotActiveAloneForceWhenIsFriend = 0

#    Requires a guild to exist, which is why worldserver.conf sets MinPetitionSigns = 0.
AiPlayerbot.BotActiveAloneForceWhenInGuild = 1

#    SmartScale sheds bot activity automatically when the world update tick climbs. Floor and
#    ceiling are milliseconds of world update time; the ceiling is tighter than the upstream 200
#    because on 4 shared vCPU you want it shedding load before the tick is visibly late.
AiPlayerbot.botActiveAloneSmartScale                 = 1
AiPlayerbot.botActiveAloneSmartScaleDiffLimitfloor   = 50
AiPlayerbot.botActiveAloneSmartScaleDiffLimitCeiling = 150
AiPlayerbot.botActiveAloneSmartScaleWhenMinLevel     = 1

#    Tracks the level cap.
# PHASE  AiPlayerbot.botActiveAloneSmartScaleWhenMaxLevel  p1=60  p2=70  p3=80
AiPlayerbot.botActiveAloneSmartScaleWhenMaxLevel = 60


###################################################################################################
# LEVEL WINDOW — bots must not exist above the cap
#
# This is the whole of the bot-side phase gate, now that Expansion no longer moves. It is also
# what conf/modules/mod_player_bot_level_brackets.conf keys off: that module clamps every bracket
# to AiPlayerbot.RandomBotMaxLevel and zeroes any bracket that ends up empty, so moving this one
# key moves the bracket distribution too, with no second edit.
###################################################################################################

AiPlayerbot.RandomBotMinLevel = 1

# PHASE  AiPlayerbot.RandomBotMaxLevel  p1=60  p2=70  p3=80
AiPlayerbot.RandomBotMaxLevel = 60

AiPlayerbot.RandomBotMinLevelChance = 0.1

#    Upstream 0.1. With 30 bots that is ~3 bots at cap, which is not enough to fill a dungeon.
#    0.4 is the difference between "bots exist" and "bots are useful". Note this only sets the
#    level a bot rolls at randomize time; mod-player-bot-level-brackets then actively redistributes
#    the roster toward its bracket targets on a 300s timer, so it, not this key, decides the
#    steady state. See that file.
AiPlayerbot.RandomBotMaxLevelChance = 0.4

#    0, deliberately. 1 ties max bot level to the highest ONLINE player instead of
#    RandomBotMaxLevel, which sounds ideal for phase gating but means bots track whoever happens
#    to be logged in rather than the phase. Explicit beats clever, and it survives someone being
#    GM-levelled.
AiPlayerbot.SyncLevelWithPlayers = 0

#    Downgrading over-cap bots. Leave 0. It only fires as each bot's randomize timer comes round
#    (floor MinRandomBotRandomizeTime = 7200s, ceiling 14 days), so it is never a fast sweep, and
#    left on permanently it dumps every bot that legitimately REACHES the cap back to
#    RandomBotMinLevel. If over-cap bots ever need to be gone quickly, the blunt but predictable
#    option is DeleteRandomBotAccounts (below).
AiPlayerbot.DowngradeMaxLevelBot = 0


###################################################################################################
# GEOGRAPHY AND CLASSES
###################################################################################################

#    Map-level only, so it cannot express "stay out of Eversong Woods" — those Blood Elf and
#    Draenei starting zones are on maps 0 and 1 and are reachable in every phase. That is the
#    accepted cosmetic cost of level-cap-only gating.
#      0 Eastern Kingdoms   1 Kalimdor   530 Outland   571 Northrend
# PHASE  AiPlayerbot.RandomBotMaps  p1=0,1  p2=0,1,530  p3=0,1,530,571
AiPlayerbot.RandomBotMaps = 0,1

#    0 IN ALL THREE PHASES. server-config.md §1 has this at 1 for phases 1 and 2; superseded by
#    "all races and classes on from phase 1". Two consequences, both intended:
#      - DK bots exist from day one. They are level-clamped correctly: RandomizeFirst() raises
#        both minLevel and maxLevel to CONFIG_START_HEROIC_PLAYER_LEVEL (55) for CLASS_DEATH_KNIGHT,
#        so with MaxPlayerLevel 60 they land in [55, 60] and you never get a level-1 DK.
#      - availableChars becomes 10 rather than 9, which is where the 130-characters-on-first-boot
#        figure above comes from.
AiPlayerbot.DisableDeathKnightLogin = 0

#    Never set this to 1. It clamps bot talent trees to 6 rows below level 61 and 8 rows below 71,
#    which would make bots strictly weaker than the humans standing next to them — the opposite of
#    "full WotLK trees throughout". Stock is already 0; stated because it is load-bearing.
AiPlayerbot.LimitTalentsExpansion = 0

#    Bot mount levels are period flavour only and affect nothing a player does. Left at stock:
#    UseGroundMountAtMinLevel 20, UseFastGroundMountAtMinLevel 40, UseFlyMountAtMinLevel 60,
#    UseFastFlyMountAtMinLevel 70. There is no flying in Eastern Kingdoms or Kalimdor in 3.3.5 at
#    all, so phase 1 has no flying regardless of what these say.


###################################################################################################
# THINGS TO SWITCH OFF ON A THREE-PERSON REALM
###################################################################################################

#    Nobody is queuing battlegrounds. These burn CPU simulating instanced BGs you will never see.
AiPlayerbot.RandomBotJoinBG     = 0
AiPlayerbot.RandomBotAutoJoinBG = 0

#    A real tradeoff. ON, bots populate the dungeon finder and your RDF queues actually pop; OFF,
#    you save the CPU and use `.playerbots bot add` / `bot addclass` instead, which is more
#    controllable for three people who play together. Turn it back on if you ever want RDF to fill
#    itself unattended — mod-solo-lfg and mod-rdf-expansion are both installed and would work.
AiPlayerbot.RandomBotJoinLfg = 0

#    Bot guild simulation, for a realm whose only guild will be yours.
AiPlayerbot.AllowGuildBots      = 0
AiPlayerbot.RandomBotGuildCount = 0

#    Stop bots cold-inviting your friends mid-quest.
AiPlayerbot.RandomBotInvitePlayer = 0

#    Stock. Marking quests complete at creation slows bot creation for no benefit here.
AiPlayerbot.PreQuests = 0

#    Keep the roster fixed and small. Periodic online/offline also multiplies the account count:
#    CalculateTotalAccountCount() does `maxBots *= periodicOnlineOfflineRatio` when this is on.
AiPlayerbot.EnablePeriodicOnlineOffline = 0


###################################################################################################
# PACING — fewer, gentler background operations
###################################################################################################

AiPlayerbot.RandomBotUpdateInterval = 30

#    Upstream 60. This is a BURST SIZE — how many bots the manager logs in / out / updates per
#    cycle. 60 against a 30-bot roster churns the entire population every cycle; 10 smooths the
#    sawtooth in tick time at startup. At 10 per cycle and 30s per cycle the roster is up in about
#    three cycles. Watch for "Random Bots Stats: N online" to settle between Min and Max.
AiPlayerbot.RandomBotsPerInterval = 10

AiPlayerbot.RandomBotCountChangeMinInterval = 1800
AiPlayerbot.RandomBotCountChangeMaxInterval = 7200

#    Upstream MinRandomBotInWorldTime is 600. An hour minimum keeps bots from cycling in and out
#    of the world constantly, which is both CPU and a lot of grid loading.
AiPlayerbot.MinRandomBotInWorldTime = 3600
AiPlayerbot.MaxRandomBotInWorldTime = 28800

AiPlayerbot.MinRandomBotTeleportInterval = 3600
AiPlayerbot.MaxRandomBotTeleportInterval = 18000


###################################################################################################
# THE RESET BUTTON
#
# 1 wipes every bot account and character and then STOPS THE SERVER with
#     "Please reset the AiPlayerbot.DeleteRandomBotAccounts to 0 and restart the server..."
# It is the only supported way to change AiPlayerbot.RandomBotAccountPrefix, and the only way to
# rebuild the roster's race/class mix — bot characters are created once, on first boot, and races
# are chosen at creation and never re-rolled. It costs every bot's level and gear.
# Leave at 0. Leave the prefix alone; bring-up.md §7.2's account audit query filters on 'RNDBOT%'.
###################################################################################################

AiPlayerbot.DeleteRandomBotAccounts = 0
AiPlayerbot.RandomBotAccountPrefix  = rndbot

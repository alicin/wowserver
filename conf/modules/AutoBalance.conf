[worldserver]
###################################################################################################
# mod-autobalance — overrides
# Pinned: azerothcore/mod-autobalance @ 5d2778e301ae7684051cdc446efbe81c7ff2a79b (tag `stable`)
# Upstream conf/AutoBalance.conf.dist at that tag sets 253 keys. This file sets 33 of them.
#
# NO INLINE COMMENTS. Upstream's own file gets this wrong on one line —
#     AutoBalance.LevelScaling.EndGameBoost = 0        # setting to 1 does not do anything
# — which parses as the string "0        # setting..." and falls back to the compiled default.
# Harmless there because the key is inert. It would not be harmless on InflectionPoint.
#
# THE PIN IS `stable`, NOT `master`, AND THE KEY SETS DIFFER IN BOTH DIRECTIONS. Verified at this
# SHA against server-config.md §4's claim, key for key:
#     AutoBalance.MinPlayers.Raid            ABSENT here, present on master
#     AutoBalance.MinPlayers.RaidHeroic      ABSENT here, present on master
#     AutoBalance.LevelScaling.EndGameBoost  PRESENT here (and inert), dropped on master
# Do not fill a gap from master's conf.dist or from the module's GitHub README — both describe
# master. A master-only key written here is not an error you will ever see; it silently does
# nothing (Config.cpp's "Found incorrect option" path is gated on isOptional, which is false for
# module configs, so it can never fire).
#
# All values below are server-config.md §4's, unchanged. That section derives them from the real
# tanh curve in getDefaultMultiplier(); do not re-derive them here.
#
# ─── THE ONE PLACE WHERE "OMIT IT AND GET THE .dist BEHAVIOUR" IS FALSE ─────────────────────────
# For the core, every worldserver.conf.dist value is byte-identical to the compiled-in default, so
# omitting a key is free. AUTOBALANCE IS THE EXCEPTION IN THIS TREE. Four of its 253 dist lines
# ship a value that is NOT what the code falls back to, so omitting them would silently change
# behaviour. All four are carried below, in the "CARRIED FROM .dist" block at the end of this file:
#     AutoBalance.MinHPModifier                                       dist 0.01   code 0.1f
#     AutoBalance.LevelScaling.DynamicLevel.PerInstance               dist "229 -1 -1 1, 230 0 0"   code ""
#     AutoBalance.LevelScaling.DynamicLevel.DistanceCheck.PerInstance dist "189 500"                code ""
#     AutoBalance.reward.enable                                       dist 0      code 1
# (Method: extract every GetOption<T>("Key", default) from src/AutoBalance.cpp at the pin, resolve
# the backwards-compatibility chains, diff against the dist. The other 249 agree. Keys whose dist
# line is EMPTY — most of the StatModifier*/InflectionPointRaid*M family — are equivalent to
# omission: the empty string fails StringTo<T> and the code default is used either way.)
###################################################################################################


###################################################################################################
# XP AND MONEY — AUTOBALANCE DOES NOT GET TO PRICE THEM
#
# Defaults are 1 (on) with Method = "dynamic", which means a creature scaled to a 0.6843
# multiplier also yields 68% of its XP, split among everyone in the instance. Against
# Rate.XP.Kill = 2 that nets ~1.37x inside dungeons while questing outdoors pays a clean 2x —
# dungeon levelling silently becomes the WORST way to level, which is the opposite of what a
# three-person server wants.
#
# Rate.XP.* in conf/worldserver.conf owns XP. This is one of the three keys that has to be
# neutral for that to be true; the others are SoloLFG.FixedXP (conf/modules/SoloLfg.conf) and
# IndividualXp.DefaultXPRate (conf/modules/individual_xp.conf).
#
# The cost, stated plainly: with reward scaling off, dungeon grinding becomes clearly the fastest
# levelling path and will outpace questing. That is the intended shape — AutoBalance makes the
# content survivable, it does not get to price it.
###################################################################################################

AutoBalance.RewardScaling.XP    = 0
AutoBalance.RewardScaling.Money = 0

#    Irrelevant while RewardScaling.XP = 0. Stated so nobody reaches for it as a "fix": it is a
#    FLAT compensating multiplier, while the scaling multiplier it would compensate for moves with
#    group size, so parity only ever holds at one group size.
AutoBalance.RewardScaling.XP.Modifier = 1.0


###################################################################################################
# NORMAL 5-MAN — three friends, no bots
#
# At the default InflectionPoint 0.5 a 3-of-5 group faces a 0.6843 multiplier: mobs at 68% health
# AND damage against 60% of a full group's bodies. Slightly harder than proportional, and it
# assumes a real tank and a real healer among the three.
#
# RAISING InflectionPoint MAKES SMALL GROUPS EASIER. The upstream comment says the opposite
# ("A lower value means that difficulty will increase faster as you add players") and is wrong
# over the full range; its 40-man example is also numerically wrong (it claims IP 0.8 puts half
# health at 12 players; the real formula gives ~29). Trust the table:
#
#     IP     1p      2p      3p      4p      5p
#     0.50  0.1235  0.3513  0.6843  0.9122  1.0000     <- upstream default
#     0.55    —     0.2823  0.6116  0.8830  1.0000     <- here
#     0.60  0.0695  0.2231  0.5347  0.8464  1.0000
#
# Tuning loop that avoids restarts: `.ab mapstat`, `.ab creaturestat`, `.ab setoffset #`
# (SEC_GAMEMASTER, acts as +1 player, live). `.reload config` DOES re-read this file.
# Do not touch StatModifier.* until the curve is right — it is a second multiplier applied after
# the curve and it makes the curve impossible to reason about.
###################################################################################################

AutoBalance.InflectionPoint              = 0.55
AutoBalance.InflectionPoint.CurveFloor   = 0.0
AutoBalance.InflectionPoint.CurveCeiling = 1.0

#    Multiplies the inflection value for bosses only, and >1.0 is EASIER (the upstream comment
#    contains a copy-paste bug that says both directions in one sentence). 1.1 takes a 3-player
#    boss from 0.6843 to 0.5270 — the usual wall.
AutoBalance.InflectionPoint.BossModifier = 1.1


###################################################################################################
# HEROIC 5-MAN — needs materially more help; WotLK heroics assume a real group
###################################################################################################

AutoBalance.InflectionPointHeroic              = 0.60
AutoBalance.InflectionPointHeroic.CurveFloor   = 0.0
AutoBalance.InflectionPointHeroic.CurveCeiling = 1.0
AutoBalance.InflectionPointHeroic.BossModifier = 1.15


###################################################################################################
# RAIDS — target: five bodies clear a 10-man and it still feels like a raid
#
#     IPRaid   3p      5p      6p      8p
#     0.50   0.2161  0.5178  0.6843  0.9122     <- upstream default
#     0.45   0.2758  0.5975  0.7497  0.9349
#     0.40   0.3455  0.6729  0.8059  0.9522     <- here
#     0.35   0.4229  0.7407  0.8522  0.9651
#
# The default 0.5178 at five players is almost exactly proportional to half a raid, which sounds
# right and plays too easy here for a reason specific to this server: you are running TBC content
# with WotLK classes. Level-70 WotLK talent trees and spell coefficients are substantially
# stronger than the TBC kits Karazhan was tuned against.
#
# Start at 0.40. If Prince Malchezaar or Netherspite wall you, 0.45. If you clear it the first
# night, 0.35. Expect to end up with per-instance overrides rather than one global number.
###################################################################################################

AutoBalance.InflectionPointRaid              = 0.40
AutoBalance.InflectionPointRaid.CurveFloor   = 0.0
AutoBalance.InflectionPointRaid.CurveCeiling = 1.0
AutoBalance.InflectionPointRaid.BossModifier = 1.0

#    On by default; set explicitly so it is visible that nothing disabled 10-mans.
AutoBalance.Enable.10M = 1

#    The two per-instance override keys, empty. These are the ONLY two that exist — there are no
#    Raid or Heroic variants, and the generic key wins over the size/difficulty defaults for the
#    instance it names. Formats, from the pinned conf.dist:
#      InflectionPoint.PerInstance       "[InstanceID] [InflectionPoint] [CurveFloor] [CurveCeiling], ..."   -1 skips a field
#      InflectionPoint.Boss.PerInstance  "[InstanceID] [InflectionPointMultiplier], ..."   a multiplier, not a new IP
#    Karazhan is believed to be InstanceID 532; confirm against your own `.ab mapstat` output
#    before committing it. Example, once confirmed:
#      AutoBalance.InflectionPoint.PerInstance      = "532 0.40 0.0 1.0"
#      AutoBalance.InflectionPoint.Boss.PerInstance = "532 1.1"
AutoBalance.InflectionPoint.PerInstance      = ""
AutoBalance.InflectionPoint.Boss.PerInstance = ""


###################################################################################################
# PLAYER-COUNT FLOORS
#
# MinPlayers is a FLOOR on the count fed to the curve. At 1 the curve is free to scale all the
# way down, which is what a three-person group wants. Raise it only to deliberately make a solo
# player face content tuned for that many bodies.
#
# There is NO AutoBalance.MinPlayers.Raid at this pin — LoadMapSettings chooses between
# MinPlayers and MinPlayers.Heroic on IsHeroic() alone, with no raid branch, so the plain
# MinPlayers below is what applies to a normal 10-man too.
#
# Both are already 1 upstream. Kept because the number is load-bearing.
###################################################################################################

AutoBalance.MinPlayers        = 1
AutoBalance.MinPlayers.Heroic = 1


###################################################################################################
# LEVEL SCALING — on, and it does NOT eat the XP rate
#
# `dynamic` preserves the instance's internal level spread relative to the highest player: trash
# stays below you, bosses stay above. (`fixed` flattens everything to one level — never use it.)
# For three people levelling in lockstep this is the single setting that makes the whole back
# catalogue playable, which matters most when the dungeon pool is capped to one expansion.
#
# It reaches XP INDIRECTLY, by calling creature->SetLevel() — the core prices a kill off the live
# level — so RewardScaling.XP = 0 does nothing about it. It still does not matter, because of the
# skip window: levels are rewritten only when the instance's AVERAGE creature level is outside
# [highestPlayer - SkipLowerLevels, highestPlayer + SkipHigherLevels]. Inside that band the module
# sets isLevelScalingEnabled = false and never calls SetLevel at all, so kill XP is exactly
# Blizzlike. Three friends running level-appropriate dungeons never see a LevelScaling XP effect.
# Outside it, the common direction here is UP (an old dungeon more than 5 levels below you goes
# from worth-zero-because-gray to worth something).
#
# THE TRAP, given the caps: with SkipLowerLevels = 5, any dungeon more than five levels below your
# highest player scales UP. At the level-60 cap that means Deadmines becomes a level-60 dungeon
# the moment a 60 walks in, and you cannot drag a friend's alt through one — the instance scales
# to YOUR level, not theirs. If that ever matters, set SkipLowerLevels = 80 ("never scale up,
# only down"); the cost is that a same-level group gets no challenge from old content. For a
# latecomer, mod-individual-xp is usually the better answer.
#
# All six values below are upstream defaults, written out because this block is the one people
# reach for when dungeon XP feels wrong and it should be readable without a diff.
###################################################################################################

AutoBalance.LevelScaling                               = 1
AutoBalance.LevelScaling.Method                        = "dynamic"
AutoBalance.LevelScaling.SkipHigherLevels              = 3
AutoBalance.LevelScaling.SkipLowerLevels               = 5
AutoBalance.LevelScaling.DynamicLevel.Ceiling.Dungeons = 1
AutoBalance.LevelScaling.DynamicLevel.Floor.Dungeons   = 5
AutoBalance.LevelScaling.DynamicLevel.Ceiling.Raids    = 3
AutoBalance.LevelScaling.DynamicLevel.Floor.Raids      = 5


###################################################################################################
# VISIBILITY
#
# Prints the recalculated multiplier to everyone in the instance when the player count changes.
# Leave it on: playerbots count as players for AutoBalance (a playerbot is a real Player in
# map->GetPlayers()), so every bot you bring pushes the multiplier back toward 1.0. Bots are an
# ALTERNATIVE to scaling, not a stack on top of it, and this line is what makes that visible
# instead of mysterious. Note also that the count is combat-locked: while the map is in combat it
# only ever ratchets up, so bringing a bot mid-pull raises difficulty permanently for that fight.
###################################################################################################

AutoBalance.PlayerChangeNotify = 1

#    NOTHING HERE IS PER-PHASE. Nothing in AutoBalance keys off MaxPlayerLevel; it scales off the
#    actual level of the highest player in the instance, so it follows the cap automatically.
#    You may still want to retune InflectionPointRaid when the raid content itself changes
#    (40-mans in phase 1, Karazhan in phase 2, 10/25s in phase 3) — that is a tuning decision,
#    not a flip, and scripts/phase.sh does not touch this file.


###################################################################################################
# CARRIED FROM .dist — THE FOUR KEYS WHOSE SHIPPED VALUE IS NOT THE COMPILED-IN DEFAULT
#
# These are not opinions. Each one is here because dropping it would silently change behaviour to
# something upstream deliberately turned off. Do not delete them because "they look like defaults".
###################################################################################################

#    Floor on the health multiplier. dist 0.01, code 0.1f. Omitted, no creature could ever be
#    scaled below 10% health — which is a floor a three-person group can actually hit at the
#    bottom of a 25-man curve.
AutoBalance.MinHPModifier = 0.01

#    Per-instance dynamic-level overrides that upstream ships POPULATED, unlike every other
#    PerInstance key in this file. Code default is "". Instances 229 (Blackrock Spire) and
#    230 (Blackrock Depths) — both sprawling, wide-level-range dungeons that misbehave under
#    blanket dynamic levelling.
#      Format: "[InstanceID] [DynamicLevelCeiling] [DynamicLevelFloor] [Enabled], ..."   -1 skips a field
AutoBalance.LevelScaling.DynamicLevel.PerInstance = "229 -1 -1 1, 230 0 0"

#    Also shipped populated; code default "". Instance 189 is Scarlet Monastery, whose four wings
#    share one map, so levels have to be recomputed by distance rather than per-map.
#      Format: "[InstanceID] [DistanceInYards], ..."
AutoBalance.LevelScaling.DynamicLevel.DistanceCheck.PerInstance = "189 500"

#    THE MOST IMPORTANT OF THE FOUR. dist ships 0; the compiled default is 1. At 1, completing an
#    encounter in a scaled post-70 dungeon hands every player an Emblem of Frost (49426) or an
#    Emblem of Triumph (47241) — AutoBalance_GlobalScript::OnAfterUpdateEncounterState. That is
#    free WotLK badge gear appearing from a difficulty module, which is not a thing anyone here
#    asked for. Omit this line and it turns itself on.
AutoBalance.reward.enable = 0
